<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLTS Online Monitoring Dashboard</title>
    <!-- Memuat Tailwind CSS untuk styling responsif Diagram -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Pustaka Anda yang sudah ada -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.0/jquery.min.js"></script>
    <!-- Perhatikan: SVG.js, Chart.js, Flatpickr, dan Paho MQTT dipanggil di bagian bawah </body> -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    
    <style>
        /* CSS Umum & MPPT/BMS dari Skrip Asli */
        body {
            font-family: 'Inter', Arial, sans-serif;
            background-color: #1a1a1a; /* Dark Charcoal dari Diagram */
            color: #E0E0E0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .main-container {
            max-width: 1200px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Container Data (MPPT/BMS) */
        .data-section-container {
            width: 100%;
            background: #242424; /* Background agak gelap */
            padding: 20px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
            border-radius: 12px; /* Lebih rounded */
            border: 1px solid #333;
        }

        h2, h4 {
            text-align: center;
            color: #4FC3F7; /* Warna Biru Terang */
            font-weight: 700;
        }
        
        /* MPPT DATA CONTAINER - Diubah ke Grid Modern */
        #data-container {
            margin-top: 15px;
            padding: 0;
            background-color: transparent; /* Transparan */
            border: none;
            border-radius: 0;
            /* Grid layout untuk item data */
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); /* Kolom lebih lebar */
            gap: 12px; /* Jarak antar kartu */
            display: grid; /* Memastikan grid aktif di sini */
        }

        /* MPPT Data Item - Dibuat menjadi Card */
        .data-item {
            padding: 15px;
            /* KEMBALIKAN WARNA BACKGROUND CARD KE 2C2C2C UNTUK KONTRAK YANG LEBIH BAIK */
            background-color: #2c2c2c; 
            border: 1px solid #3e3e3e; /* Border sedikit lebih terang */
            border-radius: 8px;
            text-align: center;
            overflow: hidden; 
            min-height: 80px; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: transform 0.2s, box-shadow 0.2s;
            box_shadow: 0 2px 5px rgba(0, 0, 0, 0.2); /* Bayangan halus */
        }
        .data-item:hover {
            transform: translateY(-3px);
            box_shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }

        .data-item strong {
            display: block;
            margin-bottom: 4px; /* Jarak antara label dan nilai */
            font-size: 0.9em;
            color: #B0B0B0; /* Abu-abu muda untuk label */
            font-weight: 500;
        }

        .data-item .payload {
            font-size: 1.5em; /* Nilai lebih besar */
            /* KEMBALIKAN FONT PAYLOAD KE PUTIH TERANG UNTUK KONTRAK & KELEGANAN */
            color: #E0E0E0; 
            font-weight: 700; /* Lebih tebal */
        }

        /* KHUSUS UNTUK STATUS: Warna Status tetap menonjol */
        .data-item.status-item {
             /* KEMBALIKAN BG KHUSUS STATUS AGAR SAMA DENGAN CARD LAIN */
             background-color: #2c2c2c; 
             border-color: #555;
        }
        .data-item.status-item .payload {
            color: #FFC107; /* Kuning Solar untuk Status/Indicator */
            font-size: 1em; /* Ukuran normal untuk nilai status panjang */
            font-weight: 600;
        }

        /* BMS Summary - Diubah menjadi Grid Card */
        .summary {
            margin-top: 15px;
            padding: 15px;
            background-color: #1a1a1a; /* Background Summary gelap */
            border: 1px solid #3e3e3e;
            border-radius: 8px;
            text-align: left; /* Teks rata kiri */
            color: #E0E0E0;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }
        .summary .summary-item {
             padding: 5px;
             border-left: 3px solid #4FC3F7; /* Indikator biru elegan */
             padding-left: 10px;
             background-color: #2c2c2c;
             border-radius: 4px;
        }
        .summary .summary-item strong {
            display: block;
            font-size: 0.8em;
            color: #B0B0B0;
        }
        .summary .summary-item b {
            display: block;
            color: #FFC107; /* Kuning Solar */
            font-size: 1.2em;
        }


        /* CSS Diagram dari Skrip Diagram */
        .svg-container {
            width: 100%;
            padding-bottom: 87.75%; /* (430/490) */
            position: relative;
        }
        .svg-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .bg-custom-dark {
            background-color: #242424; /* Sedikit lebih terang dari body untuk kontras */
        }
        
        /* FONT DAN UKURAN TEKS SVG YANG DIPERBARUI */
        .st3 { /* Label Kecil: Daily, Runtime Label */
            font-size: 12px; 
            font-weight: 400;
            fill: #C0C0C0; /* Light Gray */
        }
        .st4 { /* Nilai Power (W) */
            font-size: 14px; 
            font-weight: 700;
        } 
        .st10 { /* Nilai Energi (kWh/MWh) */
            font-size: 18px; 
            font-weight: 500;
        } 
        .st13 { /* SOC baterai */
            font-size: 20px; 
            font-weight: 600;
        } 
        .remaining-energy { /* Label Kapasitas Ah */
            font-size: 12px;
            font-weight: 500;
            fill: #C0C0C0;
        }
        
        :root {
            --color-solar: #FFAB2E;      /* HIJAU STABILO BARU */
            --color-battery: #FA3737;    /* MERAH CERAH untuk Baterai (Outline) */
            --color-grid: #4FC3F7;       /* Biru Langit/Light Blue */
            --color-load: #00FF77;       /* Hijau Cerah/Light Green */
            --color-inverter: #BBBBBB;   /* Abu-abu terang untuk Inverter */
            --color-battery-low: #FFB74D; /* Kuning/Oranye untuk SOC rendah (Default) */
            --color-bar-green: #4CAF50; /* Hijau cerah (>= 75%) */
            --color-bar-green-light: #C6FF00; /* Hijau Stabilo (>= 50%) */
            --color-bar-yellow: #FFC107; /* Kuning (>= 30%) */
            --color-bar-red: #E57373; /* Merah ( < 30% / Kosong ) */
            --color-bar-empty: #444444; /* Abu-abu gelap untuk bar yang tidak terisi (NETRAL) */
            --color-flow-highlight: #CC4400; /* Orange tua/merah pekat untuk highlight animasi */
        }
        
        /* WARNA PV DIBUAT STABILO */
        #Solar [fill="grey"], #Solar [stroke="grey"], #Solar text, #Solar path[fill="#FFFFFF"] { 
            fill: var(--color-solar) !important; 
            stroke: var(--color-solar) !important; 
        }
        #grid-flow circle { r: 3.5; fill: var(--color-grid) !important; }
        #load-flow circle { r: 3.5; fill: var(--color-load) !important; }
        #battery_flow circle { r: 3.5; fill="var(--color-battery)" !important; }
        #solar-flow circle { r: 3.5; fill: var(--color-solar) !important; } /* Flow dot PV juga stabilo */
        #Solar text { fill: var(--color-solar) !important; } /* Semua teks di grup Solar juga stabilo */
        #pv1_power_186 { fill: var(--color-solar) !important; } /* Power Box PV juga stabilo */
        #pv2_power_label { fill: var(--color-solar) !important; } /* Voltage/Current PV juga stabilo */


        #Grid #grid_total_power, #Grid #daily_grid_buy_value { fill: var(--color-grid) !important; }
        #Load #ess_power, #Load #daily_load_value { fill="var(--color-load)" !important; }
        #battery_main #data\.batteryPower_190 { fill="var(--color-battery)" !important; }
        #Inverter path { fill: var(--color-inverter) !important; } 
        #Inverter text { fill="var(--color-inverter)" !important; } 
        #solar-flow path, #grid-flow path, #load-flow path, #bat-line { stroke-width: 2; }
        #solar_power_box rect, #grid_power_box rect, #load_power_box rect, #battery_power_box rect {
             fill: none; 
        }
        
        /* MENGHAPUS CSS ANIMASI GLOW LAMA */
        #battery_icon.charging, #battery_icon.discharging, #battery_icon.low-soc {
            animation: none !important;
            filter: none !important;
        }

        /* MENGHAPUS ANIMASI GRADIENT CSS LAMA */
        /* @keyframes gradient-move { ... } */


        /* Styling Cell BMS */
        .voltages, .summary { 
            margin-top: 10px; 
            padding: 5px; 
            background: #262629; 
            border-radius: 2px;
        }
        cells {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
        cells svg {
            width: 12.5%;
            height: auto;
        }
        @media (max-width: 600px) {
            cells svg {
                width: 25%; /* 4 kolom di layar kecil */
            }
        }

        /* Loader */
        #loader {
            position: relative;
            left: 50%;
            z-index: 1;
            width: 60px;
            height: 60px;
            margin: 20px 0 0 -30px;
            border: 8px solid #f3f3f3;
            border-radius: 50%;
            border-top: 8px solid #4FC3F7;
            -webkit-animation: spin 1s linear infinite;
            animation: spin 1s linear infinite;
        }
        @-webkit-keyframes spin { 0% { -webkit-transform: rotate(0deg); } 100% { -webkit-transform: rotate(360deg); } }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Modal Style untuk Setup Awal */
        #initialSetupModal {
            display: none; /* SEMBUNYIKAN TOTAL */
        }
        
        /* TAMBAHAN CSS UNTUK DATE PICKER */
        .flatpickr-input {
            /* Menambahkan warna teks putih terang untuk visibilitas */
            color: #FFFFFF !important; 
            /* Menghilangkan background yang gelap agar kontras lebih baik, diganti oleh container Tailwind */
            background-color: transparent !important;
            /* Border default dari Tailwind di HTML sudah membantu, tapi ini memastikan teks terlihat */
        }
        
        /* CSS KHUSUS UNTUK RUNTIME - Menambahkan indikator status */
        .runtime-discharging {
            color: var(--color-battery) !important; /* Merah untuk Discharging */
            font-weight: 700;
        }
        .runtime-charging {
            color: var(--color-load) !important; /* Hijau untuk Charging */
            font-weight: 700;
        }
        .runtime-default {
            color: #C0C0C0 !important; /* Abu-abu untuk default/penuh */
        }
        /* Style untuk Arus Baterai di Area Runtime */
        .battery-current-disch {
            fill: var(--color-battery) !important; /* Merah untuk Discharge */
            font-weight: 700;
        }
        .battery-current-charge {
            fill: var(--color-load) !important; /* Hijau untuk Charge */
            font-weight: 800;
        }
        /* Style baru untuk SOH */
        .soh-good {
            fill: var(--color-load) !important; /* Hijau (SOH baik) */
            font-weight: 700;
        }
        .soh-warning {
            fill: var(--color-bar-yellow) !important; /* Kuning (SOH peringatan) */
            font-weight: 700;
        }
        .soh-default {
            fill: #C0C0C0 !important; /* Abu-abu (Label) */
            font-weight: 800;
            font-size: 11px;
        }

    </style>
</head>
<body>
    
    <!-- MODAL INPUT AWAL DIHAPUS DARI TAMPILAN -->
    
    <!-- MAIN DASHBOARD CONTENT (DITAMPILKAN SECARA DEFAULT) -->
    <div id="dashboardContent" class="main-container">
        
        <!-- HEADER -->
        <header class="text-center mb-6">
            <h1 class="text-3xl font-bold text-gray-100">PLTS Online Monitoring Dashboard</h1>
            <p class="text-gray-400 mt-2">Visualisasi Aliran Energi dan Data Sensor Real-time</p>
        </header>

        <!-- BAGIAN 1: DIAGRAM ALIRAN ENERGI (SVG) -->
        <div class="data-section-container">
            <h4 class="mb-4"></h4>
            <div class="w-full bg-custom-dark p-2 shadow-xl rounded-xl border border-gray-700">
                <div class="svg-container">
                    <!-- SVG ViewBox menggunakan -2 0 490 430. Garis vertikal tengah: X=239. Garis horizontal tengah: Y=218.5 -->
                    <svg preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-2 0 490 430" class="svg-content">
                        
                        <!-- Definisikan Gradien SVG -->
                        <defs>
                            <!-- Gradien dinamis akan dibuat di JavaScript -->
                        </defs>
                        
                        <!-- Solar Elements -->
                        <svg id="Solar" style="overflow: visible; display: inline;" x="0%" y="-6%">
                            <!-- PV Icon (Sun/Panel) -->
                            <svg id="sun" x="120" y="48" width="30" height="30" viewBox="0 0 24 24">
                                <path fill="var(--color-solar)" d="M11.45 2v3.55L15 3.77L11.45 2m-1 6L8 10.46l3.75 1.25L10.45 8M2 11.45L3.77 15l1.78-3.55H2M10 2H2v8c.57.17 1.17.25 1.77.25c3.58.01 6.49-2.9 6.5-6.5c-.01-.59-.1-1.18-.27-1.75m7 20v-6h-3l5-9v6h3l-5 9Z"></path>
                            </svg>
                            
                            <!-- Total Solar Value (Top Center) -->
                            <text id="total_solar_generation" x="239" y="72" dominant-baseline="central" text-anchor="middle" display="" class="st3" fill="var(--color-solar)">
                                DAILY SOLAR / TOTAL SOLAR
                            </text>
                            <a href="#">
                                <text id="total_solar_value" x="239" y="55" dominant-baseline="central" text-anchor="middle" class="st10" fill="var(--color-solar)">
                                    -- kWh / -- MWh
                                </text>
                            </a>

                            <!-- PV Module (Simulated data) -->
                            <svg width="70" height="30" viewBox="0 0 70 30" overflow="visible" id="pv1" x="204" y="90">
                                <rect width="70" height="30" rx="4.5" ry="4.5" fill="none" stroke-width="1" pointer-events="all" id="pv1" stroke="var(--color-solar)" class=""></rect>
                            </svg>
                            
                            
                            <!-- NILAI PARAMETER BARU (Detail PV) -->
                            <a href="#">
                                <text id="pv2_power_label" x="239" y="105" dominant-baseline="central" text-anchor="middle" class="st1 st3" fill="var(--color-solar)">
                                    --V / --A
                                </text>
                            </a>

                            <!-- Kotak Daya Solar (Transparan) -->
                            <svg id="solar_power_box" x="204" y="155">
                                <rect width="70" height="30" rx="4.5" ry="4.5" fill="none" stroke-width="1" pointer-events="all" stroke="var(--color-solar)"></rect>
                                
                                <!-- Nilai Daya Solar (Diposisikan tengah pada kotak) - PASTI TERLIHAT DI LAPISAN DEPAN KOTAK -->
                                <a href="#">
                                    <text id="pv1_power_186" x="35" y="15" dominant-baseline="central" text-anchor="middle" class="st2 st7" fill="var(--color-solar)">
                                        -- W
                                    </text>
                                </a >
                            </svg>


                            <!-- Flow line down from Solar to Inverter - Menggunakan X=239 sebagai sumbu tengah -->
                            <svg xmlns:xlink="http://www.w3.org/1999/xlink" overflow="visible" id="solar-flow">
                                <!-- Path 1: Dari PV Module ke Kotak Daya Solar -->
                                <path fill="none" stroke-miterlimit="10" pointer-events="stroke" id="solar-line-1" d="M 239 120 L 239 155" stroke="var(--color-solar)" stroke-width="2" class="st12"></path>
                                <!-- Path 2: Dari Kotak Daya Solar ke Inverter -->
                                <path fill="none" stroke-miterlimit="10" pointer-events="stroke" id="solar-line-2" d="M 239 185 L 239 215" stroke="var(--color-solar)" stroke-width="2" class="st12"></path>
                                
                                <!-- Titik Animasi 1 (Flow PV -> Kotak) -->
                                <circle cx="0" cy="0" r="3.5" fill="var(--color-solar)">
                                    <animateMotion id="solar_flow_anim_1" repeatCount="indefinite" keyTimes="0;1" calcMode="linear" dur="2s">
                                        <mpath href="#solar-line-1"></path>
                                    </animateMotion>
                                </circle>
                                <!-- Titik Animasi 2 (Flow Kotak -> Inverter) -->
                                <circle cx="0" cy="0" r="3.5" fill="var(--color-solar)">
                                    <animateMotion id="solar_flow_anim_2" repeatCount="indefinite" keyTimes="0;1" calcMode="linear" dur="2s">
                                        <mpath href="#solar-line-2"></path>
                                    </animateMotion>
                                </circle>
                            </svg>
                        </svg>
                    
                        <!-- Inverter Elements -->
                        <svg id="Inverter" style="overflow: visible" x="0%">
                            <!-- Inverter Icon (Energy Manager) -->
                            <svg x="213.5" y="179.5" width="54" height="79" viewBox="0 0 74 91" preserveAspectRatio="xMidYMid meet" opacity="1">
                                <g transform="translate(0.000000,91.000000) scale(0.100000,-0.100000)" stroke="none" fill="var(--color-inverter)">
                                    <path d="M35 887 l-27 -23 0 -404 0 -404 27 -23 c26 -23 28 -23 329 -23 284 0 305 1 327 19 l24 19 0 412 0 412 -24 19 c-22 18 -43 19 -327 19 -301 0 -303 0 -329 -23z m585 -157 l0 -80 -255 0 -255 0 0 80 0 80 255 0 255 0 0 -80z m-242 -229 c44 -34 40 -46 -14 -46 -60 0 -97 -38 -93 -94 5 -64 -23 -80 -35 -20 -9 44 24 113 63 134 35 18 34 15 21 50 -11 29 -14 30 58 -24z m110 -129 c4 -51 -19 -97 -59 -117 -27 -14 -30 -20 -23 -48 l6 -31 -51 43 c-29 24 -49 46 -46 49 3 4 23 5 44 3 58 -4 95 32 97 95 3 60 1 57 17 52 6 -3 13 -23 15 -46z"></path>
                                </g>
                            </svg>

                            <!-- Inverter Data (RHS of Inverter Icon) -->
                            <a href="#">
                                <text id="inverter_voltage_154" x="315" y="165" display="" class="st3 left-align" fill="var(--color-inverter)">
                                    -- V
                                </text>
                            </a>
                            <a href="#">
                                <text id="inverter_current_164" x="315" y="177" display="" class="st3 left-align" fill="var(--color-inverter)">
                                    -- A
                                </text>
                            </a>
                            <a href="#">
                                <text id="load_frequency_192" x="315" y="189" display="" class="st3 left-align" fill="var(--color-inverter)">
                                    -- Hz
                                </text>
                            </a >

                            <!-- Autarky / Ratio (LHS of Inverter Icon) -->
                            <text id="autarkyp_value" x="120" y="270" display="" class="st4 st8 left-align" fill="var(--color-inverter)">
                                --%
                            </text>
                            <text id="autarky" x="120" y="285" display="" class="st3 left-align" fill="var(--color-inverter)">
                                Autarky
                            </text>
                            <text id="ratiop_value" x="160" y="270" display="" class="st4 st8 left-align" fill="var(--color-inverter)">
                                --%
                            </text>
                            <text id="ratio" x="165" y="285" display="" class="st3 left-align" fill="var(--color-inverter)">
                                Ratio
                            </text>
                        </svg>
                    
                        <!-- Grid Elements -->
                        <svg id="Grid" style="overflow: visible; display: inline;">
                            <!-- Grid Icon (Pylon/Tower) -->
                            <svg id="transmission_on" x="20" y="185" width="64.5" height="64.5" viewBox="0 0 24 24">
                                <path fill="var(--color-grid)" d="m8.28 5.45l-1.78-.9L7.76 2h8.47l1.27 2.55l-1.78.89L15 4H9l-.72 1.45M18.62 8h-4.53l-.79-3h-2.6l-.79 3H5.38L4.1 10.55l1.79.89l.73-1.44h10.76l.72 1.45l1.79-.89L18.62 8m-.85 14H15.7l-.24-.9L12 15.9l-3.47 5.2l-.23.9H6.23l2.89-11h2.07l-.36 1.35L12 14.1l1.16-1.75l-.35-1.35h2.07l2.89 11m-6.37-7l-.9-1.35l-1.18 4.48L11.4 15m3.28 3.12l-1.18-4.48l-.9 1.36l2.08 3.12Z"></path>
                            </svg>

                            <!-- KOTAK BARU UNTUK DISPLAY POWER GRID -->
                            <svg id="grid_power_box" x="103" y="203.5">
                                <rect width="70" height="30" rx="4.5" ry="4.5" fill="none" stroke-width="1" pointer-events="all" stroke="var(--color-grid)"></rect>
                                
                                <!-- Nilai Daya Grid -->
                                <a href="#">
                                    <!-- INI SEKARANG MENAMPILkan NILAI GRID BUY YANG DIHITUNG -->
                                    <text id="grid_total_power" x="35" y="15" dominant-baseline="central" text-anchor="middle" class="st4 st8" fill="var(--color-grid)">
                                        -- W
                                    </text>
                                </a>
                            </svg>

                            <!-- Grid Flow line to Inverter -->
                            <svg id="grid-flow">
                                <!-- Path 1: Dari Grid Icon ke Kotak -->
                                <path fill="none" stroke-miterlimit="10" pointer-events="stroke" id="grid-line-1" d="M 77 218.5 L 103 218.5" display="" stroke="var(--color-grid)" stroke-width="2"></path>
                                <!-- Path 2: Dari Kotak ke Inverter -->
                                <path fill="none" stroke-miterlimit="10" pointer-events="stroke" id="grid-line-2" d="M 173 218.5 L 214 218.5" display="" stroke="var(--color-grid)" stroke-width="2"></path>

                                <!-- Titik Animasi 1 (Flow Icon <-> Kotak) -->
                                <circle cx="0" cy="0" r="3.5" fill="var(--color-grid)">
                                    <animateMotion id="grid_flow_anim_1" repeatCount="indefinite" keyTimes="1;0" calcMode="linear" dur="2s">
                                        <mpath href="#grid-line-1"></path>
                                    </animateMotion>
                                </circle>
                                <!-- Titik Animasi 2 (Flow Kotak <-> Inverter) -->
                                <circle cx="0" cy="0" r="3.5" fill="var(--color-grid)">
                                    <animateMotion id="grid_flow_anim_2" repeatCount="indefinite" keyTimes="1;0" calcMode="linear" dur="2s">
                                        <mpath href="#grid-line-2"></path>
                                    </animateMotion>
                                </circle>
                            </svg>
                            
                            <!-- Daily Grid Buy Value -->
                            <text id="daily_grid_buy_value" x="20" y="265" display="" class="st10 left-align" fill="var(--color-grid)">
                                --
                            </text>
                            <text id="daily_grid_buy" x="10" y="280" display="" class="st3 left-align" fill="var(--color-grid)">
                                DAILY GRID BUY
                            </text>

                        </svg>
                    
                        <!-- Load Elements -->
                        <svg id="Load" style="overflow: visible" x="0%">
                            <!-- KOTAK BARU UNTUK DISPLAY POWER LOAD -->
                            <svg id="load_power_box" x="304" y="203.5">
                                <rect width="70" height="30" rx="4.5" ry="4.5" fill="none" stroke-width="1" pointer-events="all" stroke="var(--color-load)"></rect>
                                
                                <!-- Nilai Daya Load -->
                                <a href="#">

    <!-- SCRIPT LOGIC -->

        // ==========================================================

        // START: FUNGSI YANG DIPINDAHKAN KE LINGKUP GLOBAL
        function createChart(labels, datasets) {
            const ctx = document.getElementById('lineChart').getContext('2d');
            if (chart) chart.destroy();
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            ticks: { color: '#E0E0E0' }
                        },
                        y: {
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            ticks: { color: '#E0E0E0' }
                        }
                    },
                    elements: {
                        line: { tension: 0.4 },
                        point: { radius: 0 }
                    }
                }
            });
        }

        function createCheckboxes() {
            const container = document.getElementById('checkboxContainer');
            container.innerHTML = '';
            datasets.forEach((dataset, index) => {
                const div = document.createElement('div');
                div.className = 'flex items-center space-x-2 p-1 rounded-md';
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = !dataset.hidden;
                checkbox.id = `checkbox${index}`;
                checkbox.className = 'w-4 h-4 rounded';
                checkbox.style.accentColor = dataset.borderColor;
                checkbox.addEventListener('change', (e) => {
                    datasets[index].hidden = !e.target.checked;
                    chart.update();
                });
                const labelElement = document.createElement('label');
                labelElement.htmlFor = `checkbox${index}`;
                labelElement.textContent = dataset.label;
                labelElement.className = 'text-sm cursor-pointer';
                labelElement.style.color = dataset.borderColor;
                div.appendChild(checkbox);
                div.appendChild(labelElement);
                container.appendChild(div);
            });
        }
        // END: FUNGSI YANG DIPINDAHKAN KE LINGKUP GLOBAL
        
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const csvData = e.target.result;
                parseCSVData(csvData);
            };
            reader.readAsText(file);
        }

        function parseCSVData(csvData) {
            const lines = csvData.trim().split('\n');
            const labels = [];
            const dataSets = {};
            lines.forEach((line, index) => {
                const columns = line.split(',');
                if (index === 0) {
                    columns.slice(1).forEach(col => dataSets[col] = []);
                } else {
                    if (columns.length > 1) { 
                        labels.push(columns[0].substring(0,5));
                        columns.slice(1).forEach((value, i) => {
                            const colName = Object.keys(dataSets)[i];
                            dataSets[colName].push(parseFloat(value));
                        });
                    }
                }
            });
            
            const finalLabels = labels.filter(l => l.length > 0);

            datasets = Object.keys(dataSets).map((name, i) => ({
                label: name,
                data: dataSets[name],
                borderColor: `hsl(${(i * 130) % 360}, 100%, 50%)`,
                borderWidth: 1.5, 
                fill: false,
                hidden: !(i < 3), 
                pointRadius: 0,
                tension: 0.4
            }));
            // Panggilan fungsi sekarang di lingkup global
            createChart(finalLabels, datasets);
            createCheckboxes();
        }

        
        // ==========================================================
        // 2. BMS CELL LOGIC (Fungsionalitas Lama)
        // ==========================================================

                this.outline = this.draw.path('M 370.00,167.00 C 370.00,167.00 375.00,167.00 375.00,167.00 387.50,166.75 394.00,160.00 394.00,146.50 394.00,146.50 393.75,78.25 393.75,78.25 393.56,63.00 389.93,58.07 375.00,58.00 375.00,58.00 370.00,58.00 370.00,58.00 370.00,58.00 370.00,37.00 370.00,37.00 369.96,13.09 353.69,1.27 331.00,1.00 331.00,1.00 236.00,1.00 236.00,1.00 236.00,1.00 66.00,1.00 66.00,1.00 43.43,1.04 25.04,11.12 25.00,36.00 25.00,36.00 25.00,189.00 25.00,189.00 25.03,209.15 38.85,222.97 59.00,223.00 59.00,223.00 111.00,223.00 111.00,223.00 111.00,223.00 336.00,223.00 336.00,223.00 340.92,222.99 343.25,223.05 348.00,221.29 373.59,211.83 370.00,188.71 370.00,167.00 Z');
                this.outline.attr({ fill: '#444444' }); // Dark mode color
                
                this.inline = this.draw.path('M 60.31,35.60 C 65.28,34.40 82.75,35.00 89.00,35.00 89.00,35.00 146.00,35.00 146.00,35.00 146.00,35.00 328.00,35.00 328.00,35.00 330.30,35.00 334.41,34.62 335.98,36.60 337.23,38.19 337.00,42.01 337.00,44.00 337.00,44.00 337.00,69.00 337.00,69.00 337.00,69.00 337.00,181.00 337.00,181.00 337.00,182.99 337.23,186.81 335.98,188.40 334.63,190.10 331.95,189.96 330.00,190.00 330.00,190.00 311.00,190.00 311.00,190.00 311.00,190.00 226.00,190.00 226.00,190.00 226.00,190.00 67.00,190.00 67.00,190.00 65.01,190.00 61.19,190.23 59.60,188.98 57.07,186.97 58.00,173.58 58.00,170.00 58.00,170.00 58.00,109.00 58.00,109.00 58.00,109.00 58.00,55.00 58.00,55.00 58.00,51.91 57.61,39.34 58.60,37.31 59.34,35.80 59.56,36.24 60.31,35.60 Z');
                this.inline.attr({ fill: '#1a1a1a', 'fill-opacity': 1.0 }); // Dark mode background
                
                this.rect = this.draw.rect({ width: 0, height: this.RECT_HEIGHT });
                this.rect.move(this.RECT_LOC_X, this.RECT_LOC_Y);
                this.rect.attr({ fill: '#66BB6A', 'fill-opacity': 1.0 });

                // --- PERBAIKAN: Default display sekarang V ---
                this.text = this.draw.text('---V');

                    family: 'monospace'

            getDrawing() {
                return this.draw;
            }
            /**
             * Memperbarui visualisasi sel LiFePO4.
             * Catatan: Nilai cellV kini diasumsikan dalam Volt (V) sesuai configuration.yaml,
             * dan dikonversi ke mV di sini untuk logika rentang lama.
             */
            setVoltage(cellV, battV, remPerc) {
                // Konversi V ke mV untuk logika skala bar
                const cellVMV = cellV * 1000;
                
                const MIN_V_MV = 3000; // 3.0V (0% SOC)
                const MAX_V_MV = 3650; // 3.65V (100% SOC normal)
                const WARNING_V_MV = 3300; // 3.3V (Batas bawah zona aman)

                if (cellVMV >= MIN_V_MV) { 
                    // Hitung persentase bar relatif terhadap rentang LFP (3000mV - 3650mV)
                    let fillPercentage = (cellVMV - MIN_V_MV) / (MAX_V_MV - MIN_V_MV); 
                    
                    if (fillPercentage > 1) fillPercentage = 1; // Maksimum 100%
                    if (fillPercentage < 0) fillPercentage = 0; // Minimum 0% (meskipun kita cek cellV >= MIN_V, untuk berjaga-jaga)
                    
                    let rectWidth = parseInt(267 * fillPercentage);

                    // Aturan Warna LFP:
                    if (cellVMV >= WARNING_V_MV) {
                        this.rect.attr({ fill: '#66BB6A' }); // Hijau (Aman/Normal, > 3.3V)
                    } else if (cellVMV > MIN_V_MV) {
                        this.rect.attr({ fill: '#FFC107' }); // Kuning/Oranye (Peringatan, 3.0V - 3.3V)
                    } else {
                         this.rect.attr({ fill: '#FF5252' }); // Merah (Kritis, <= 3.0V)
                    }
                    
                    this.rect.size(rectWidth, this.RECT_HEIGHT);
                    // --- PERBAIKAN: Tampilkan nilai dalam V dengan 2 desimal ---
                    this.text.tspan(cellV.toFixed(2) + 'V');
                } else {
                    this.text.tspan('---V');
                    this.rect.size(0, this.RECT_HEIGHT);
                    this.rect.attr({ fill: '#FF5252' }); // Merah jika nilai tidak wajar
                }
            }
            setBalancing(balancing) {
                // Sederhanakan agar tidak crash (Hanya ubah warna statis)
                if (balancing) {
                    this.outline.attr({ fill: '#806ef1' }); // Warna ungu saat balancing
                } else {
                    this.outline.attr({ fill: '#444444' }); // Warna default dark mode
                }
                this.balancing = !!balancing;
            }
        }
        let cells = [];
        // Variabel global yang digunakan di file lama
        let vpack, RSOC, current, power, remcapacity, nomcapacity, cycles, cellbalance, Vdiff;
        
        // Timer Log Request
        let logRequestTimer = null; 

        // ==========================================================
        // 3. DIAGRAM SVG LOGIC (Fungsionalitas Baru)
        // ==========================================================
        
        const DEFAULT_DISPLAY = 0.0;
        const DEFAULT_DISPLAY_STR = '--';

        // Helper untuk parsing angka yang aman
        function tryParseFloat(value) {
            const parsed = parseFloat(value);
            // Kembali ke DEFAULT_DISPLAY (0.0) jika NaN, null, atau undefined
            if (isNaN(parsed) || value === null || value === undefined) {
                return DEFAULT_DISPLAY;
            }
            return parsed;
        }

        // Data yang dipetakan dari MQTT untuk Diagram

            // runtime dihapus, diganti oleh Voltase dan Arus
            inverterStatus: DEFAULT_DISPLAY_STR,

            // Data Total Solar yang dimuat dari localStorage - DIHAPUS
            // totalSolarMWh: 0.0 
        };
        // Tambahkan kembali totalSolarMWh ke object data agar tidak error pada updateTextValues
        latestDiagramData.totalSolarMWh = 0.0;

        // Fungsi yang sama
        function getFlowDuration(power) {
            const minDuration = 0.5;
            const maxDuration = 10;
            const maxPower = 5000;
            let duration = maxDuration - (power / maxPower) * (maxDuration - minDuration);
            
            if (power < 10) duration = maxDuration;
            if (power > maxPower) duration = minDuration; 
            
            return `${duration.toFixed(1)}s`;
        }

        // Fungsi yang sama
        function controlFlow(animIds, powerValue, absPower, forwardKeyPoints, reverseKeyPoints) {
            const flowSpeed = getFlowDuration(absPower);
            const isFlowing = absPower > 10; // Threshold 10W untuk start flow
            
            animIds.forEach(id => {
                const animElement = document.getElementById(id);
                if (!animElement) return;

                if (!isFlowing) {
                    animElement.parentNode.style.opacity = 0; // Sembunyikan dot
                    animElement.setAttribute('dur', '10.0s');
                    animElement.setAttribute('repeatCount', '1'); // Stop animation (1 repeat)
                } else {
                    animElement.parentNode.style.opacity = 1; // Tampilkan dot
                    animElement.setAttribute('repeatCount', 'indefinite');
                    animElement.setAttribute('keyTimes', '0;1'); 
                    animElement.setAttribute('dur', flowSpeed);
                }
                
                // Atur arah
                if (powerValue > 0) { // Arah "Positif" (default path direction)
                    animElement.setAttribute('keyPoints', forwardKeyPoints);
                } else { // Arah "Negatif" (kebalikan dari default path direction)
                    animElement.setAttribute('keyPoints', reverseKeyPoints);
                }
            });
        }
        
        // FUNGSI INTI UNTUK MENGHITUNG DAN MEMPERBARUI SEMUA DATA DIAGRAM
        function calculateAndRenderDiagram() {
            // Ambil nilai data yang dibutuhkan
            const rawGridPower = latestDiagramData.rawGridPower; 
            
            // Power Grid Display HANYA menggunakan Raw Grid Power
            const gridFlowValue = latestDiagramData.rawGridPower; // Positif = Buy, Negatif = Sell
            const gridAbsPower = Math.abs(gridFlowValue);
            
            // Tentukan Power yang akan ditampilkan di kotak grid
            let displayPower;
            
            // Jika daya mutlak (absolut) di bawah ambang batas (misal 10W), anggap 0W
            if (gridAbsPower < 10) {
                displayPower = DEFAULT_DISPLAY;
            } else {
                displayPower = gridFlowValue;
            }
            
            // Simpan nilai Grid Power yang digunakan untuk Flow/Display
            latestDiagramData.gridPower = displayPower; 
            
            // =========================================================
            // PERHITUNGAN RATIO (Self-Consumption Rate)
            // =========================================================
            const solarP = latestDiagramData.solarPower;
            const loadP = latestDiagramData.loadPower;
            
            // Daya yang ditarik dari baterai (Discharge = Positif)
            const batteryDischarge = latestDiagramData.batteryPower > 0 ? latestDiagramData.batteryPower : 0; 
            
            // Total Daya Mandiri (PV + Discharge Baterai)
            const selfGeneratedPower = solarP + batteryDischarge;
            
            let ratio = 0;

            if (loadP > 10) { // Hanya hitung jika ada beban
                // Batasi selfGeneratedPower ke nilai maksimum loadP (agar Ratio max 100%)
                const usedSelfGeneratedPower = Math.min(selfGeneratedPower, loadP);
                ratio = (usedSelfGeneratedPower / loadP) * 100;
            } else {
                // Jika tidak ada beban atau beban sangat kecil, ratio tidak relevan atau 100% jika PV > 0
                ratio = (solarP > 10) ? 100 : 0;
            }

            latestDiagramData.ratioPercentage = ratio;
            // =========================================================
            
            // RUNTIME LOGIC DIHAPUS - DIGANTI VOLTAGE/CURRENT
            
            // 2. Render
            updateTextValues(latestDiagramData);
            updateBatteryLevel(latestDiagramData.batterySOC, latestDiagramData.batteryPower); // Kirim batteryPower
            
            // 3. Kontrol Animasi Aliran (Semua aliran lain tetap berdasarkan perhitungan net)
            
            // 1. Solar Flow (Solar -> Inverter)
            controlFlow(['solar_flow_anim_1', 'solar_flow_anim_2'], latestDiagramData.solarPower, Math.abs(latestDiagramData.solarPower), "0;1", "1;0");

            // 2. Load Flow (Inverter -> Load)
            controlFlow(['load_flow_anim_1', 'load_flow_anim_2'], latestDiagramData.loadPower, Math.abs(latestDiagramData.loadPower), "0;1", "1;0");

            // 3. Battery Flow (Tergantung tanda BMS power)
            const batAbsPower = Math.abs(latestDiagramData.batteryPower);
            
            if (latestDiagramData.batteryPower > 10) { // Discharge (BAT -> INV, UPWARDS). Positif=Discharge
                controlFlow(['bat_flow_anim_1', 'bat_flow_anim_2'], 1, batAbsPower, "1;0", "0;1"); 
            } else if (latestDiagramData.batteryPower < -10) { // Charge (INV -> BAT, DOWNWARDS). Negatif=Charge
                 controlFlow(['bat_flow_anim_1', 'bat_flow_anim_2'], -1, batAbsPower, "0;1", "1;0");
            } else {
                controlFlow(['bat_flow_anim_1', 'bat_flow_anim_2'], 0, 0, "0;1", "1;0"); 
            }

            // 4. Grid Flow (Buy/Import atau Sell/Export) HANYA BERDASARKAN rawGridPower
            const flowValue = latestDiagramData.gridPower; 
            const flowAbsPower = Math.abs(flowValue);

            const gridPowerBox = document.getElementById('grid_power_box').querySelector('rect');
            const gridPowerText = document.getElementById('grid_total_power');

            if (flowValue > 10) { // Buy/Import (Grid -> Inverter: 1;0)
                controlFlow(['grid_flow_anim_1', 'grid_flow_anim_2'], -1, flowAbsPower, "1;0", "0;1");
                gridPowerText.textContent = `${flowValue.toFixed(1)} W`;
                gridPowerBox.setAttribute('stroke', 'var(--color-grid)'); // Biru (Input)
            } else if (flowValue < -10) { // Sell/Export (Inverter -> Grid: 0;1)
                controlFlow(['grid_flow_anim_1', 'grid_flow_anim_2'], 1, flowAbsPower, "0;1", "1;0");
                gridPowerText.textContent = `${flowAbsPower.toFixed(1)} W`;
                gridPowerBox.setAttribute('stroke', 'var(--color-load)'); // Hijau (Output)
            } else {
                // No Flow (0W)
                controlFlow(['grid_flow_anim_1', 'grid_flow_anim_2'], 0, 0, "1;0", "0;1"); 
                gridPowerText.textContent = `${DEFAULT_DISPLAY.toFixed(1)} W`;
                gridPowerBox.setAttribute('stroke', 'var(--color-grid)');
            }
            
            // Update Grid text label (Buy/Sell)
            const dailyGridBuy = tryParseFloat(latestDiagramData.dailyGridBuy);
            const dailyGridSell = tryParseFloat(latestDiagramData.dailyGridSell);
            const gridTextLabel = document.getElementById('daily_grid_buy');
            const gridValueLabel = document.getElementById('daily_grid_buy_value');

            if (dailyGridSell > 0.1 && dailyGridSell > dailyGridBuy) {
                // Jika Sell lebih besar, tampilkan Sell
                gridTextLabel.textContent = "DAILY GRID SELL";
                gridValueLabel.textContent = `${dailyGridSell.toFixed(2)} kWh`;
                gridValueLabel.setAttribute('fill', 'var(--color-load)'); 
            } else {
                // Default: Tampilkan Buy
                gridTextLabel.textContent = "DAILY GRID BUY";
                gridValueLabel.textContent = `${dailyGridBuy.toFixed(2)} kWh`;
                gridValueLabel.setAttribute('fill', 'var(--color-grid)');
            }
        }

            // --- PERUBAHAN: SOC | SOH ---
            const sohValue = latestDiagramData.batterySOH !== undefined ? latestDiagramData.batterySOH : DEFAULT_DISPLAY_STR;

            // Update Teks SOH
            const socElement = document.getElementById('battery_soc_184');
            if(socElement) {
                socElement.textContent = `${data.batterySOC}%`; // Teks pertama tetap SOC
                
                // Buat TSpan baru untuk SOH
                const sohTspan = document.createElementNS("http://www.w3.org/2000/svg", "tspan");
                sohTspan.textContent = ` | ${sohValue}% `;
                sohTspan.setAttribute('class', sohClassName);
                sohTspan.setAttribute('fill', sohFillColor);
                
                // Hapus TSpan sebelumnya (jika ada) dan tambahkan yang baru
                // Ini adalah penanganan yang lebih andal untuk TSpan dalam SVG text
                Array.from(socElement.childNodes).forEach(node => {
                    if (node.nodeType === 1 && node.tagName === 'TSPAN') {
                         node.remove();
                    }
                });
                
                // Tambahkan TSpan SOH setelah SOC
                socElement.appendChild(sohTspan);
            }
            // -----------------------------
            
            setText('battery_remaining_energy', data.batteryRemainingEnergy); 
            
            // --- LOGIKA VOLTAGE DAN CURRENT BATERAI DI AREA RUNTIME ---
            const durationElement = document.getElementById('duration');
            const durationTextElement = document.getElementById('duration_text');
            
            const batteryV = vpack !== undefined ? vpack.toFixed(1) : DEFAULT_DISPLAY_STR;
            const rawBatteryI = current !== undefined ? current : DEFAULT_DISPLAY; // Ambil nilai mentah (Pos/Neg)
            const currentThreshold = 0.1; // 0.1 A
            
            let displayCurrentI = Math.abs(rawBatteryI).toFixed(1);
            
            if (durationElement) {
                // Baris 1: Voltase Baterai (Tetap statis)
                durationElement.textContent = `${batteryV} V`;
                durationElement.className = 'st4 left-align runtime-default'; // Reset class
                
                // Baris 2: Arus Baterai (dengan warna dinamis & status)
                durationTextElement.className = 'st3 left-align'; // Reset class
                
                // PERBAIKAN LOGIKA: KEMBALIKAN LOGIKA INI KE KONVENSI USER (Negatif = Discharge)
                if (rawBatteryI < -currentThreshold) { // Jika arus Negatif (Discharge)
                    // DISCHARGE: Tampilkan tanda MINUS di depan angka
                    displayCurrentI = "-" + displayCurrentI;
                    
                    durationTextElement.classList.add('battery-current-disch'); // Merah
                    durationTextElement.textContent = `${displayCurrentI} A (Discharge)`;

                } else if (rawBatteryI > currentThreshold) { // Jika arus Positif (Charge)
                    // CHARGE: Tampilkan angka tanpa tanda (positif)
                    durationTextElement.classList.add('battery-current-charge'); // Hijau
                    durationTextElement.textContent = `${displayCurrentI} A (Charge)`;
                } else {
                    // IDLE
                    durationTextElement.textContent = `${displayCurrentI} A (Idle)`;
                }
            }
            // --- END LOGIKA BARU ---
        }

        /**
         * FUNGSI BARU: Mengupdate level dan animasi baterai sesuai SOC dan aliran daya.
         * @param {number} soc State of Charge (0-100).
         * @param {number} batPower Power baterai (Positif = Discharge, Negatif = Charge).
         */
        function updateBatteryLevel(soc, batPower) {
            const batteryInner = document.getElementById('bat_inner');
            const batteryIcon = document.getElementById('battery_icon');
            const svgDefs = document.querySelector('.svg-content defs');

            if (!batteryInner || !batteryIcon || !svgDefs) return;
            
            batteryInner.querySelectorAll('rect').forEach(rect => rect.remove());

            const totalBars = 8;
            const socPerBar = 100 / totalBars; // 12.5% per bar
            const barWidth = 7;
            const barHeight = 1.5;
            const startX = 5;
            const startYVisual = 6; 
            
            soc = parseInt(soc);
            if (isNaN(soc) || soc < 0) soc = 0;
            if (soc > 100) soc = 100;

            // --- 1. Tentukan Warna Utama berdasarkan Range SOC ---
            let overallColorStop; // Warna solid untuk stop gradient
            
            if (soc >= 75) {
                overallColorStop = 'var(--color-bar-yellow)'; // Hijau Penuh
            } else if (soc >= 50) {
                overallColorStop = 'var(--color-bar-green-light)'; // Hijau Stabilo
            } else if (soc >= 30) {
                overallColorStop = 'var(--color-bar-yellow)'; // Kuning
            } else {
                overallColorStop = 'var(--color-bar-red)'; // Merah
            }

            // Warna untuk bar yang tidak terisi: abu-abu gelap
            const emptyColor = 'var(--color-bar-empty)'; 

            // --- 2. Buat dan Animasikan Gradien Merah (Flow Overlay) ---
            
            // Hapus gradien lama jika ada
            svgDefs.innerHTML = '';
            
            // ID gradien agar unik
            const gradientId = `socFlowGradient`; 
            const gradient = document.createElementNS("http://www.w3.org/2000/svg", "linearGradient");
            gradient.setAttribute('id', gradientId);
            gradient.setAttribute('x1', '0%');
            gradient.setAttribute('y1', '0%'); 
            gradient.setAttribute('x2', '0%');
            gradient.setAttribute('y2', '30%'); // Ulangi setiap 20%
            gradient.setAttribute('spreadMethod', 'repeat');
            gradient.setAttribute('gradientUnits', 'userSpaceOnUse');

            // Stop 1: Warna Dasar SOC
            let stop1 = document.createElementNS("http://www.w3.org/2000/svg", "stop");
            stop1.setAttribute('offset', '0%');
            stop1.setAttribute('stop-color', overallColorStop); 
            stop1.setAttribute('stop-opacity', '1.0');
            
            // Stop 2: Warna Highlight Flow (Merah/Oranye) - Lebih tebal dan pekat
            let stop2 = document.createElementNS("http://www.w3.org/2000/svg", "stop");
            stop2.setAttribute('offset', '20%');
            stop2.setAttribute('stop-color', '#D00000'); // Merah/Oranye Pekat
            stop2.setAttribute('stop-opacity', '1.0'); 

            // Stop 3: Transition kembali ke Base Color
            let stop3 = document.createElementNS("http://www.w3.org/2000/svg", "stop");
            stop3.setAttribute('offset', '30%');
            stop3.setAttribute('stop-color', '#FF6B00');
            stop3.setAttribute('stop-opacity', '1.0'); 
            
            // Stop 4: Warna Dasar (sisanya)
            let stop4 = document.createElementNS("http://www.w3.org/2000/svg", "stop");
            stop4.setAttribute('offset', '100%');
            stop4.setAttribute('stop-color', '#FFD700');
            stop4.setAttribute('stop-opacity', '1.0');

            gradient.appendChild(stop1);
            gradient.appendChild(stop2);
            gradient.appendChild(stop3);
            gradient.appendChild(stop4);

            // Animasi pergerakan gradient (simulasi cairan naik)
            let animMotion = document.createElementNS("http://www.w3.org/2000/svg", "animateTransform");
            animMotion.setAttribute('attributeName', 'gradientTransform');
            animMotion.setAttribute('type', 'translate');
            animMotion.setAttribute('from', '0 20');
            animMotion.setAttribute('to', '0 0'); // Pindahkan 20 unit ke bawah (visual naik, karena y1=0%, y2=20%)
            animMotion.setAttribute('dur', '2.0s'); // DIPERLAMBAT MENJADI 2.0S
            animMotion.setAttribute('repeatCount', 'indefinite');
            
            gradient.appendChild(animMotion);
            svgDefs.appendChild(gradient);
            
            const fillUrl = `url(#${gradientId})`;

            // --- 3. Render Bar Level ---
            
            for (let i = 0; i < totalBars; i++) {
                const minSocToFillBar = (totalBars - i) * socPerBar; 
                const isFilled = soc > (minSocToFillBar - socPerBar);
                
                // Jika bar terisi, gunakan fill gradient yang sudah dianimasikan
                const finalBarFill = isFilled ? fillUrl : emptyColor;

                // Perhitungan Posisi Y: Y meningkat seiring i meningkat (Top-Down drawing)
                const yPosition = startYVisual + (i * (barHeight + 0.5));
                
                const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                rect.setAttribute('x', startX);
                rect.setAttribute('y', yPosition);
                rect.setAttribute('width', barWidth);
                rect.setAttribute('height', barHeight);
                rect.setAttribute('rx', 0.5);
                rect.setAttribute('ry', 0.5);
                
                // Terapkan fill
                rect.setAttribute('fill', finalBarFill); 
                
                batteryInner.appendChild(rect);
            }
        }

        // FUNGSI BARU UNTUK MENGAMBIL DATA POWER METER DARI fatkhur/pwrMeter
        function updatePowerMeterData(payload) {
            try {

                // --- MAPPING DATA INVERTER / AC METER ---
                const v = tryParseFloat(data.volt).toFixed(1);
                const i = tryParseFloat(data.current).toFixed(1);
                const f = tryParseFloat(data.freq).toFixed(1);

                latestDiagramData.inverterVoltage = `${v} V`;
                latestDiagramData.inverterCurrent = `${i} A`;
                latestDiagramData.loadFrequency = `${f} Hz`;

                // MAPPING LOAD POWER (KOTAK RUMAH): Active Power Absolut dari Meter
                const activePower = tryParseFloat(data.activePower);
                
                // Load Power adalah Active Power yang diukur (Absolut), dibulatkan ke 1 desimal
                latestDiagramData.loadPower = parseFloat(Math.abs(activePower).toFixed(1));

                console.error("Failed to parse Power Meter JSON:", e, payload);

        // FUNGSI UNTUK MENGAMBIL DATA MPPT (Topics yang sama di kedua file)
        function updateData(topic, payload) {
            const container = document.getElementById('data-container');
            
            // Ambil hanya bagian akhir topic, misalnya 'mppt_power' dari '3469224/amsanmppt/mppt_power'
            let rawDataKey = topic.substring(topic.lastIndexOf('/') + 1); 
            const keyLower = rawDataKey.toLowerCase();
            
            // --- FILTER: Abaikan topic BMS yang tidak relevan di grid MPPT ---
            const IGNORED_BMS_STATUS = ['out', 'chg', 'bat', 'stb', 'capacity']; 
            if (IGNORED_BMS_STATUS.includes(keyLower)) {
                return; // Abaikan data ini
            }
            // ------------------------------------------------------------------

            // Tentukan Display Key menggunakan mapping, jika tidak ada, gunakan rawDataKey
            let displayKey = MPPT_NAME_MAPPING[rawDataKey] || rawDataKey.toUpperCase();
            
            let pValue = tryParseFloat(payload);
            let shouldRecalculate = false;

            // --- MAPPING DATA UNTUK DIAGRAM ---
            
            if (topic.includes('sunsynk_grid_power') || topic.includes('sunsynk_grid_ct_power')) {
                latestDiagramData.rawGridPower = pValue;
                shouldRecalculate = true;
            }
            if (topic.includes('sunsynk_day_grid_import')) {
                latestDiagramData.dailyGridBuy = pValue.toFixed(2);
            }
            if (topic.includes('sunsynk_day_grid_export')) {
                latestDiagramData.dailyGridSell = pValue.toFixed(2);
            }
            if (topic.includes('mppt_energy_today')) {
                latestDiagramData.dailySolar = pValue.toFixed(2);
            }
            // MAPPING KHUSUS DARI UTILITY METER
            if (topic.includes('energy_harian_out')) {
                 latestDiagramData.dailyLoad = pValue.toFixed(2);
            }
            if (topic.includes('day_battery_charge_70')) {
                latestDiagramData.dailyBatCharge = pValue.toFixed(2);
            }
            if (topic.includes('day_battery_discharge_71')) {
                latestDiagramData.dailyBatDischarge = pValue.toFixed(2);
            }
            if (topic.includes('mppt_power')) {
                latestDiagramData.solarPower = parseFloat(pValue.toFixed(1)); 
                shouldRecalculate = true;
            }
            if (topic.includes('mppt_voltage_pv')) {
                latestDiagramData.pvVoltage = `${pValue.toFixed(1)} V`;
            }
            if (topic.includes('mppt_current')) {
                latestDiagramData.pvCurrent = `${pValue.toFixed(1)} A`;
            }
            if (topic.includes('sunsynk_overall_state')) {
                latestDiagramData.inverterStatus = payload;
            }
            
            // --- PERUBAHAN STATUS (Menggunakan rawDataKey untuk penentuan, displayKey untuk label) ---
            if (keyLower === 'status' || keyLower === 'sunsynk_overall_state') {
                const statuses = payload.split(';').filter(s => s.trim() !== '');
                
                removeStatusItems(); 
                
                statuses.forEach((status, index) => {
                    const parts = status.split('-');
                    const statusKey = parts[0] || 'STATUS';
                    const statusValue = parts.slice(1).join('-') || status;

                    const id = `mppt-status-${index}`;
                    
                    let dataItem = document.createElement('div');
                    dataItem.className = 'data-item status-item'; 
                    dataItem.id = id;
                    
                    // Gunakan label bahasa awam di sini jika status adalah kunci yang dikenal
                    const statusDisplayKey = MPPT_NAME_MAPPING[statusKey] || statusKey; 
                    
                    dataItem.innerHTML = `<strong>${statusDisplayKey}</strong><div class="payload">${statusValue}</div>`;
                    container.appendChild(dataItem);
                });
                return; 
            }

            // Jika bukan status, proses seperti biasa
            dataItem = document.getElementById(topic);
            
            if (!dataItem) {
                dataItem = document.createElement('div');
                dataItem.className = 'data-item';
                // Gunakan topic string penuh sebagai ID untuk memastikan keunikan
                dataItem.id = topic; 
                container.appendChild(dataItem);
            }

            let displayPayload = payload;
            
            if (pValue !== DEFAULT_DISPLAY) {
                // Formatting payload value
                if (payload.length > 5 || pValue === 0) {
                     displayPayload = pValue.toFixed(2);
                } else {
                    displayPayload = payload;
                }
            }
            
            // Gunakan displayKey (nama awam) sebagai label display
            dataItem.innerHTML = `<strong>${displayKey}</strong><div class="payload">${displayPayload}</div>`;

            if (shouldRecalculate) {
                 calculateAndRenderDiagram();
            }
        }

        /**
         * Mengupdate data BMS dari MQTT.
         * CATATAN: Disesuaikan dengan unit measurement di configuration.yaml:
         * - packVolt (mV) -> Perlu dibagi 1000 untuk V.
         * - current (mA) -> Perlu dibagi 1000 untuk A.
         * - VCELL0-7 (V) -> TIDAK perlu dikonversi ke mV, langsung diproses oleh Cell Class (yang akan konversi ke mV internal).
         * - remainingCapacity (mAh) -> Perlu dibagi 1000 untuk Ah.
         * - VCELLDiff (mV) -> Sudah benar.
         */
        function updateDataBat(topic, payload) {
            let EndTopic = topic.split("/").pop(); 
            let shouldUpdateSummary = false;
            const EndTopicLower = EndTopic.toLowerCase();
            let pValue = tryParseFloat(payload); // Gunakan tryParseFloat untuk stabilitas
            let shouldRecalculate = false;

            if (isNaN(pValue)) return;

            // === Mengambil data ke variabel global ===
            if(EndTopicLower === "packvolt"){
                // data dalam mV, konversi ke V untuk tampilan summary
                vpack = pValue / 1000;
                shouldUpdateSummary = true;
            }
            else if(EndTopicLower === "relativesoc"){
                RSOC = pValue;
                latestDiagramData.batterySOC = pValue; 
                shouldUpdateSummary = true;
            }
            else if(EndTopicLower === "remainingcapacity"){
                // data dalam mAh, konversi ke Ah untuk display diagram
                remcapacity = pValue / 1000;
                latestDiagramData.batteryRemainingEnergy = `${remcapacity.toFixed(1)} Ah`; 
                shouldUpdateSummary = true;
            }
            else if(EndTopicLower === "current"){
                 // data dalam mA, konversi ke A untuk tampilan summary
                current = pValue / 1000;
                shouldUpdateSummary = true;
            }
            else if(EndTopicLower === "power"){
                // data dalam W
                power = pValue;
                latestDiagramData.batteryPower = parseFloat(pValue.toFixed(1)); 
                shouldUpdateSummary = true;
                shouldRecalculate = true;
            }
            // Hapus logic runtime mapping:
            // else if(EndTopicLower === "timeremaining" || EndTopicLower === "runtime" || topic.includes('runtime')) {
            //      latestDiagramData.runtime = payload; 
            // }
            else if(EndTopicLower === "nominalcapacity"){
                 // data dalam mAh, konversi ke Ah untuk tampilan summary
                nomcapacity = pValue / 1000;
                shouldUpdateSummary = true;
            }
            else if(EndTopicLower === "cyclelife"){
                // Nilai siklus digunakan sebagai dasar (atau placeholder) SOH
                cycles = pValue;
                // Asumsi sederhana: SOH dihitung (atau hanya diset 100% untuk demo)
                latestDiagramData.batterySOH = Math.max(100 - (pValue * 0.05), 80).toFixed(0); // Contoh: Turun 5% per 100 siklus, minimal 80%
                shouldUpdateSummary = true;
            }
            else if(EndTopicLower === "balancestatus"){
                cellbalance = pValue;
                let x = 0;
                while ((x <cells.length)) {
                    cells[x].setBalancing(cellbalance & (0b1 << x));
                    x++;
                }
            }
            else if(EndTopicLower.startsWith('vcell')){
                const cellIndex = parseInt(EndTopic.substring(5));
                if (cellIndex >= 0 && cellIndex < cells.length) {
                    // PValue sudah dalam V (sesuai configuration.yaml), kirim langsung
                    cells[cellIndex].setVoltage(pValue, vpack, RSOC);
                }
            }
            else if(EndTopicLower === 'vcelldiff'){
               // data dalam mV
               Vdiff = pValue;
               shouldUpdateSummary = true;
            }
            
            // === Membangun Summary Text (Menggunakan struktur grid baru) ===
            if(shouldUpdateSummary) {
                // vpack sekarang sudah dalam V
                const v = vpack !== undefined ? vpack.toFixed(1) : DEFAULT_DISPLAY_STR;
                // current sekarang sudah dalam A
                const i = current !== undefined ? current.toFixed(1) : DEFAULT_DISPLAY_STR;
                const p = power !== undefined ? parseFloat(power).toFixed(1) : DEFAULT_DISPLAY_STR; 
                const soc = RSOC !== undefined ? RSOC : DEFAULT_DISPLAY_STR;
                const cyc = cycles !== undefined ? cycles : DEFAULT_DISPLAY_STR;
                const vD = Vdiff !== undefined ? Vdiff : DEFAULT_DISPLAY_STR;
                
                // Content dalam format baru
                const summaryHtml = `
                    <div class="summary-item"><strong>PACK VOLTAGE</strong><b>${v} V</b></div>
                    <div class="summary-item"><strong>CURRENT</strong><b>${i} A</b></div>
                    <div class="summary-item"><strong>POWER</strong><b>${p} W</b></div>
                    <div class="summary-item"><strong>SOC</strong><b>${soc} %</b></div>
                    <div class="summary-item"><strong>CYCLES</strong><b>${cyc} x</b></div>
                    <div class="summary-item"><strong>CELL DIFF</strong><b>${vD} mV</b></div>
                `;

                $('.summary').html(summaryHtml);
            }
            
            if (shouldRecalculate) {
                calculateAndRenderDiagram();
            }
        }

        // FUNGSI LAMA (INIT) - MENGGABUNGKAN KONEKSI MQTT UNTUK SEMUA DATA
        function initMqttClient() {
            client.on("connect", () => {
                console.log('%cConnected to broker', 'color: cyan; font-weight: bold;');
                
                // Langganan Topik:
                client.subscribe('3469224/#'); 
                client.subscribe('JBDMBS/#'); // TOPIC JBDMBS DARI configuration.yaml
                client.subscribe('fatkhur/pwrMeter');

                // --- TOPIC TAMBAHAN DARI PEMETAAN SENSOR YAML ---
                client.subscribe('sunsynk_grid_power');
                client.subscribe('sunsynk_grid_ct_power'); 
                client.subscribe('sunsynk_day_grid_import');
                client.subscribe('sunsynk_day_grid_export');
                client.subscribe('mppt_energy_today'); 
                client.subscribe('energy_harian_out'); // <--- LANGGANAN BARU UNTUK DAILY LOAD
                client.subscribe('mppt_power');
                client.subscribe('mppt_voltage_pv');
                client.subscribe('mppt_current');
                client.subscribe('sunsynk_overall_state');
                
                calculateAndRenderDiagram(); 
            });

            client.on("error", (error) => {
                console.error('Connection failed: ', error);
                $('.summary').html(`<span style="color:red; font-weight:bold;">KONEKSI GAGAL! Periksa Konsol Browser. Error: ${error.message}</span>`);
            });
            
            client.on("message", (topic, payloadBuffer) => {
                const topicString = topic.toString();
                const payload = payloadBuffer.toString();
                
                // Peta topik spesifik Home Assistant (jika ada)
                if (topicString === "fatkhur/pwrMeter" || topicString.includes('power_meter')) {
                    updatePowerMeterData(payload);
                }
                else if (topicString === "3469224/amsanmppt/log") {
                    // Hapus timer jika ada respons, karena perangkat mulai merespons
                    if (logRequestTimer) {
                        clearTimeout(logRequestTimer);
                        logRequestTimer = null;
                    }
                    if(is_request_log == true){
                        if (payload.indexOf("Time") >= 0) {
                            csv_like_data = payload + '\n'
                            // Jangan clear timer di sini, clear hanya ketika Fail atau endOfFile
                        } else if (payload.indexOf("endOfFile") >= 0) {
                            unshowAn();
                            // Panggil fungsi global
                            parseCSVData(csv_like_data);
                            is_request_log=false;
                        } else if (payload.indexOf("Fail") >= 0) {
                            unshowAn("LOG REQUEST FAILED: Data Not available, or broken storage on device!"); 
                            console.error("Data Not available, or broken storage!"); 
                            is_request_log=false;
                        } else {
                            csv_like_data += payload + '\n'
                        }
                    }
                } 
                else if (topicString.includes("JBDMBS") || topicString.includes("jbdmbs")) {
                    updateDataBat(topicString, payload);
                } 
                // Topik yang tidak teridentifikasi di atas, asumsikan itu data MPPT/Inverter
                else {
                    updateData(topicString, payload);
                }
            });
        }
        
        function handleLogTimeout() {
            is_request_log = false;
            // Membersihkan pesan dari ringkasan BMS/MPPT agar tidak mengganggu data summary
            const chartAreaStatus = document.querySelector('.data-section-container:last-of-type .p-4');
            if (chartAreaStatus) {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'text-center text-red-400 p-2 font-bold';
                messageDiv.textContent = 'LOG REQUEST FAILED: No response from device within 10 seconds. Check MQTT topic or device status.';
                
                // Sisipkan pesan di atas chart
                const chartCanvas = document.getElementById('lineChart');
                chartAreaStatus.insertBefore(messageDiv, chartCanvas);
            }
            unshowAn();
            console.error("Log request timed out.");
        }


        function unshowAn(message = "") {
            document.getElementById("loader").style.display = "none";
            // Hapus timer jika fungsi ini dipanggil (misalnya karena sukses atau gagal dari device)
            if (logRequestTimer) {
                clearTimeout(logRequestTimer);
                logRequestTimer = null;
            }
        }
        function showAn() {
            document.getElementById("loader").style.display = "block";
            // Hapus pesan error lama di area grafik
            const chartAreaStatus = document.querySelector('.data-section-container:last-of-type .p-4');
             chartAreaStatus.querySelectorAll('div').forEach(el => {
                if (el.textContent.includes('LOG REQUEST FAILED') || el.textContent.includes('Check MQTT')) {
                    el.remove();
                }
            });
        }


        // ==========================================================
        // 6. EVENT HANDLERS & INITIALIZATION
        // ==========================================================

        $(document).ready(function() {
            const cellContainer = $('cells');
            let x = 8;
            while (x-- > 0) {
                const cell = new Cell(80, 70, 5);
                cells.push(cell);
                cell.getDrawing().addTo(cellContainer.get(0));
            }

            // Inisialisasi awal diagram
            calculateAndRenderDiagram();

            // INISIALISASI MQTT CLIENT SETELAH DOM LENGKAP
            initMqttClient();
        });

        document.getElementById('requestButton').addEventListener('click', function() {
            const selectedDate = datePicker.input.value;
            const url = `1#${selectedDate}`;
            
            // Verifikasi koneksi sebelum publish
            if (client && client.connected) {
                
                // Clear any existing timer just in case
                if (logRequestTimer) clearTimeout(logRequestTimer);
                
                client.publish('3469224/amsanmppt/cmd', url); 
                is_request_log = true;
                showAn();

                console.log(`Log request sent to '3469224/amsanmppt/cmd' with payload: ${url}`);
                
                // Set timeout (10 seconds)
                logRequestTimer = setTimeout(handleLogTimeout, 10000); 

            } else {
                 // Langsung tampilkan pesan jika tidak terhubung
                 const chartAreaStatus = document.querySelector('.data-section-container:last-of-type .p-4');
                 if (chartAreaStatus) {
                    const messageDiv = document.createElement('div');
                    messageDiv.className = 'text-center text-red-400 p-2 font-bold';
                    messageDiv.textContent = 'LOG REQUEST FAILED: MQTT Client not connected! Check your broker connection.';
                    
                    const chartCanvas = document.getElementById('lineChart');
                    chartAreaStatus.insertBefore(messageDiv, chartCanvas);
                 }
                console.error("MQTT Client not connected!");
            }
        });


    </script>
