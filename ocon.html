<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLTS Online Monitoring Dashboard</title>
    <!-- Memuat Tailwind CSS untuk styling responsif Diagram -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Pustaka Anda yang sudah ada -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.0/jquery.min.js"></script>
    <!-- Perhatikan: SVG.js, Chart.js, Flatpickr, dan Paho MQTT dipanggil di bagian bawah </body> -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    
    <style>
        /* CSS Umum & MPPT/BMS dari Skrip Asli */
        body {
            font-family: 'Inter', Arial, sans-serif;
            background-color: #1a1a1a; /* Dark Charcoal dari Diagram */
            color: #E0E0E0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .main-container {
            max-width: 1200px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Container Data (MPPT/BMS) */
        .data-section-container {
            width: 100%;
            background: #242424; /* Background agak gelap */
            padding: 20px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            border: 1px solid #333;
        }

        h2, h4 {
            text-align: center;
            color: #4FC3F7; /* Warna Biru Terang */
            font-weight: 700;
        }
        
        #data-container {
            margin-top: 10px;
            padding: 5px;
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 5px;
            /* Grid layout untuk item data */
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 5px;
        }

        .data-item {
            padding: 5px;
            background-color: #2c2c2c; /* Warna latar belakang standar */
            border: 1px solid #444; /* Border standar */
            border-radius: 5px;
            text-align: center;
            overflow: hidden; 
            min-height: 50px; 
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .data-item strong {
            display: block;
            margin-bottom: 2px;
            font-size: 0.85em;
            color: #E0E0E0;
        }

        .data-item .payload {
            font-size: 1.1em;
            color: #66BB6A; /* Hijau */
            font-weight: bold;
        }

        /* KHUSUS UNTUK STATUS: Gunakan warna yang berbeda agar menonjol sebagai indikator status */
        .data-item.status-item .payload {
            color: #FFC107; /* Kuning Solar untuk Status/Indicator */
            font-size: 0.9em;
            font-weight: bold;
        }

        .summary {
            margin-top: 10px;
            padding: 10px;
            background-color: #2c2c2c;
            border-radius: 5px;
            text-align: center;
            color: #E0E0E0;
        }
        .summary span {
            display: block;
            font-size: 1em;
            margin: 5px 0;
        }
        .summary b {
            color: #FFC107; /* Kuning Solar */
        }


        /* CSS Diagram dari Skrip Diagram */
        .svg-container {
            width: 100%;
            padding-bottom: 87.75%; /* (430/490) */
            position: relative;
        }
        .svg-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .bg-custom-dark {
            background-color: #242424; /* Sedikit lebih terang dari body untuk kontras */
        }
        /* Definisikan skema warna dan ukuran font yang disederhanakan */
        .st3, .st4, .st8, .st10, .st12, .st13, .st14, .remaining-energy {
            font-size: 10px;
            font-weight: 500;
            fill: #E0E0E0; /* Default text color (light gray) */
        }
        .st4 { font-size: 14px; font-weight: 700; } /* Untuk nilai power utama */
        .st10 { font-size: 16px; font-weight: 700; } /* Untuk nilai energi harian/total */
        .st13 { font-size: 20px; font-weight: 700; } /* Untuk SOC baterai */
        
        :root {
            --color-solar: #FFC107;      /* Orange Emas Cerah untuk Solar */
            --color-battery: #FF5252;    /* MERAH CERAH untuk Baterai */
            --color-grid: #4FC3F7;       /* Biru Langit/Light Blue */
            --color-load: #66BB6A;       /* Hijau Cerah/Light Green */
            --color-inverter: #BBBBBB;   /* Abu-abu terang untuk Inverter */
            --color-battery-low: #FFB74D; /* Oranye untuk SOC rendah */
            --color-bar-green: #4CAF50; /* Hijau cerah untuk bar penuh */
            --color-bar-red: #E57373; /* Merah cerah untuk bar kosong */
        }
        #Solar [fill="grey"], #Solar [stroke="grey"], #Solar text, #Solar path[fill="#FFFFFF"] { 
            fill: var(--color-solar) !important; 
            stroke: var(--color-solar) !important; 
        }
        #Grid #grid_total_power, #Grid #daily_grid_buy_value { fill: var(--color-grid) !important; }
        #Load #ess_power, #Load #daily_load_value { fill: var(--color-load) !important; }
        #battery_main #data\.batteryPower_190 { fill: var(--color-battery) !important; }
        #Inverter path { fill: var(--color-inverter) !important; } 
        #Inverter text { fill: var(--color-inverter) !important; } 
        #solar-flow path, #grid-flow path, #load-flow path, #bat-line { stroke-width: 2; }
        #solar-flow circle { r: 3.5; fill: var(--color-solar) !important; } 
        #grid-flow circle { r: 3.5; fill: var(--color-grid) !important; }
        #load-flow circle { r: 3.5; fill: var(--color-load) !important; }
        #battery_flow circle { r: 3.5; fill="var(--color-battery)" !important; }
        #solar_power_box rect, #grid_power_box rect, #load_power_box rect, #battery_power_box rect {
             fill: none; 
        }
        /* CSS Animasi Baterai */
        @keyframes battery-pulse {
            0% { transform: scale(1.0); opacity: 1; }
            50% { transform: scale(1.03); opacity: 0.85; }
            100% { transform: scale(1.0); opacity: 1; }
        }
        .is-charging {
            animation: battery-pulse 1.5s infinite;
        }

        /* Styling Cell BMS */
        .voltages, .summary { 
            margin-top: 10px; 
            padding: 5px; 
            background: #1a1a1a; 
            border-radius: 4px;
        }
        cells {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
        cells svg {
            width: 12.5%;
            height: auto;
        }
        @media (max-width: 600px) {
            cells svg {
                width: 25%; /* 4 kolom di layar kecil */
            }
        }

        /* Loader */
        #loader {
            position: relative;
            left: 50%;
            z-index: 1;
            width: 60px;
            height: 60px;
            margin: 20px 0 0 -30px;
            border: 8px solid #f3f3f3;
            border-radius: 50%;
            border-top: 8px solid #4FC3F7;
            -webkit-animation: spin 1s linear infinite;
            animation: spin 1s linear infinite;
        }
        @-webkit-keyframes spin { 0% { -webkit-transform: rotate(0deg); } 100% { -webkit-transform: rotate(360deg); } }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>
    
    <div class="main-container">
        <!-- HEADER -->
        <header class="text-center mb-6">
            <h1 class="text-3xl font-bold text-gray-100">PLTS Online Monitoring Dashboard</h1>
            <p class="text-gray-400 mt-2">Visualisasi Aliran Energi dan Data Sensor Real-time</p>
        </header>

        <!-- BAGIAN 1: DIAGRAM ALIRAN ENERGI (SVG) -->
        <div class="data-section-container">
            <h4 class="mb-4">Visualisasi Sistem Energi</h4>
            <div class="w-full bg-custom-dark p-2 shadow-xl rounded-xl border border-gray-700">
                <div class="svg-container">
                    <!-- SVG ViewBox menggunakan -2 0 490 430. Garis vertikal tengah: X=239. Garis horizontal tengah: Y=218.5 -->
                    <svg preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-2 0 490 430" class="svg-content">
                        
                        <!-- Solar Elements -->
                        <svg id="Solar" style="overflow: visible; display: inline;" x="0%" y="-6%">
                            <!-- PV Icon (Sun/Panel) -->
                            <svg id="sun" x="134" y="50" width="30" height="30" viewBox="0 0 24 24">
                                <path fill="var(--color-solar)" d="M11.45 2v3.55L15 3.77L11.45 2m-1 6L8 10.46l3.75 1.25L10.45 8M2 11.45L3.77 15l1.78-3.55H2M10 2H2v8c.57.17 1.17.25 1.77.25c3.58.01 6.49-2.9 6.5-6.5c-.01-.59-.1-1.18-.27-1.75m7 20v-6h-3l5-9v6h3l-5 9Z"></path>
                            </svg>
                            
                            <!-- Total Solar Value (Top Center) -->
                            <text id="total_solar_generation" x="239" y="70" dominant-baseline="central" text-anchor="middle" display="" class="st3" fill="var(--color-solar)">
                                DAILY SOLAR / TOTAL SOLAR
                            </text>
                            <a href="#">
                                <text id="total_solar_value" x="239" y="55" dominant-baseline="central" text-anchor="middle" display="" class="st10" fill="var(--color-solar)">
                                    -- kWh / -- MWh
                                </text>
                            </a>

                            <!-- PV Module (Simulated data) -->
                            <svg width="70" height="30" viewBox="0 0 70 30" overflow="visible" id="pv1" x="204" y="90">
                                <rect width="70" height="30" rx="4.5" ry="4.5" fill="none" stroke-width="1" pointer-events="all" id="pv1" stroke="var(--color-solar)" class=""></rect>
                            </svg>
                            
                            
                            <!-- NILAI PARAMETER BARU (Detail PV) -->
                            <a href="#">
                                <text id="pv2_power_label" x="239" y="105" dominant-baseline="central" text-anchor="middle" class="st3 st8" fill="var(--color-solar)">
                                    --V / --A
                                </text>
                            </a>

                            <!-- Kotak Daya Solar (Transparan) -->
                            <svg id="solar_power_box" x="204" y="160">
                                <rect width="70" height="30" rx="4.5" ry="4.5" fill="none" stroke-width="2" pointer-events="all" stroke="var(--color-solar)"></rect>
                                
                                <!-- Nilai Daya Solar (Diposisikan tengah pada kotak) - PASTI TERLIHAT DI LAPISAN DEPAN KOTAK -->
                                <a href="#">
                                    <text id="pv1_power_186" x="35" y="15" dominant-baseline="central" text-anchor="middle" class="st4 st8" fill="var(--color-solar)">
                                        -- W
                                    </text>
                                </a >
                            </svg>


                            <!-- Flow line down from Solar to Inverter - Menggunakan X=239 sebagai sumbu tengah -->
                            <svg xmlns:xlink="http://www.w3.org/1999/xlink" overflow="visible" id="solar-flow">
                                <!-- Path 1: Dari PV Module ke Kotak Daya Solar -->
                                <path fill="none" stroke-miterlimit="10" pointer-events="stroke" id="solar-line-1" d="M 239 120 L 239 160" stroke="var(--color-solar)" stroke-width="2" class="st12"></path>
                                <!-- Path 2: Dari Kotak Daya Solar ke Inverter -->
                                <path fill="none" stroke-miterlimit="10" pointer-events="stroke" id="solar-line-2" d="M 239 190 L 239 214.5" stroke="var(--color-solar)" stroke-width="2" class="st12"></path>
                                
                                <!-- Titik Animasi 1 (Flow PV -> Kotak) -->
                                <circle cx="0" cy="0" r="3.5" fill="var(--color-solar)">
                                    <animateMotion id="solar_flow_anim_1" repeatCount="indefinite" keyTimes="0;1" calcMode="linear" dur="2s">
                                        <mpath href="#solar-line-1"></path>
                                    </animateMotion>
                                </circle>
                                <!-- Titik Animasi 2 (Flow Kotak -> Inverter) -->
                                <circle cx="0" cy="0" r="3.5" fill="var(--color-solar)">
                                    <animateMotion id="solar_flow_anim_2" repeatCount="indefinite" keyTimes="0;1" calcMode="linear" dur="2s">
                                        <mpath href="#solar-line-2"></path>
                                    </animateMotion>
                                </circle>
                            </svg>
                        </svg>
                    
                        <!-- Inverter Elements -->
                        <svg id="Inverter" style="overflow: visible" x="0%">
                            <!-- Inverter Icon (Energy Manager) -->
                            <svg x="213.5" y="179.5" width="54" height="79" viewBox="0 0 74 91" preserveAspectRatio="xMidYMid meet" opacity="1">
                                <g transform="translate(0.000000,91.000000) scale(0.100000,-0.100000)" stroke="none" fill="var(--color-inverter)">
                                    <path d="M35 887 l-27 -23 0 -404 0 -404 27 -23 c26 -23 28 -23 329 -23 284 0 305 1 327 19 l24 19 0 412 0 412 -24 19 c-22 18 -43 19 -327 19 -301 0 -303 0 -329 -23z m585 -157 l0 -80 -255 0 -255 0 0 80 0 80 255 0 255 0 0 -80z m-242 -229 c44 -34 40 -46 -14 -46 -60 0 -97 -38 -93 -94 5 -64 -23 -80 -35 -20 -9 44 24 113 63 134 35 18 34 15 21 50 -11 29 -14 30 58 -24z m110 -129 c4 -51 -19 -97 -59 -117 -27 -14 -30 -20 -23 -48 l6 -31 -51 43 c-29 24 -49 46 -46 49 3 4 23 5 44 3 58 -4 95 32 97 95 3 60 1 57 17 52 6 -3 13 -23 15 -46z"></path>
                                </g>
                            </svg>

                            <!-- Inverter Data (RHS of Inverter Icon) -->
                            <a href="#">
                                <text id="inverter_voltage_154" x="315" y="165" display="" class="st3 left-align" fill="var(--color-inverter)">
                                    -- V
                                </text>
                            </a>
                            <a href="#">
                                <text id="inverter_current_164" x="315" y="177" display="" class="st3 left-align" fill="var(--color-inverter)">
                                    -- A
                                </text>
                            </a>
                            <a href="#">
                                <text id="load_frequency_192" x="315" y="189" display="" class="st3 left-align" fill="var(--color-inverter)">
                                    -- Hz
                                </text>
                            </a >

                            <!-- Autarky / Ratio (LHS of Inverter Icon) -->
                            <text id="autarkyp_value" x="120" y="270" display="" class="st4 st8 left-align" fill="var(--color-inverter)">
                                --%
                            </text>
                            <text id="autarky" x="120" y="285" display="" class="st3 left-align" fill="var(--color-inverter)">
                                Autarky
                            </text>
                            <text id="ratiop_value" x="160" y="270" display="" class="st4 st8 left-align" fill="var(--color-inverter)">
                                --%
                            </text>
                            <text id="ratio" x="165" y="285" display="" class="st3 left-align" fill="var(--color-inverter)">
                                Ratio
                            </text>
                        </svg>
                    
                        <!-- Grid Elements -->
                        <svg id="Grid" style="overflow: visible; display: inline;">
                            <!-- Grid Icon (Pylon/Tower) -->
                            <svg id="transmission_on" x="20" y="187.5" width="64.5" height="64.5" viewBox="0 0 24 24">
                                <path fill="var(--color-grid)" d="m8.28 5.45l-1.78-.9L7.76 2h8.47l1.27 2.55l-1.78.89L15 4H9l-.72 1.45M18.62 8h-4.53l-.79-3h-2.6l-.79 3H5.38L4.1 10.55l1.79.89l.73-1.44h10.76l.72 1.45l1.79-.89L18.62 8m-.85 14H15.7l-.24-.9L12 15.9l-3.47 5.2l-.23.9H6.23l2.89-11h2.07l-.36 1.35L12 14.1l1.16-1.75l-.35-1.35h2.07l2.89 11m-6.37-7l-.9-1.35l-1.18 4.48L11.4 15m3.28 3.12l-1.18-4.48l-.9 1.36l2.08 3.12Z"></path>
                            </svg>

                            <!-- KOTAK BARU UNTUK DISPLAY POWER GRID -->
                            <svg id="grid_power_box" x="103" y="203.5">
                                <rect width="70" height="30" rx="4.5" ry="4.5" fill="none" stroke-width="2" pointer-events="all" stroke="var(--color-grid)"></rect>
                                
                                <!-- Nilai Daya Grid -->
                                <a href="#">
                                    <!-- INI SEKARANG MENAMPILKAN NILAI GRID BUY YANG DIHITUNG -->
                                    <text id="grid_total_power" x="35" y="15" dominant-baseline="central" text-anchor="middle" class="st4 st8" fill="var(--color-grid)">
                                        -- W
                                    </text>
                                </a>
                            </svg>

                            <!-- Grid Flow line to Inverter -->
                            <svg id="grid-flow">
                                <!-- Path 1: Dari Grid Icon ke Kotak -->
                                <path fill="none" stroke-miterlimit="10" pointer-events="stroke" id="grid-line-1" d="M 77 218.5 L 103 218.5" display="" stroke="var(--color-grid)" stroke-width="2"></path>
                                <!-- Path 2: Dari Kotak ke Inverter -->
                                <path fill="none" stroke-miterlimit="10" pointer-events="stroke" id="grid-line-2" d="M 173 218.5 L 214 218.5" display="" stroke="var(--color-grid)" stroke-width="2"></path>

                                <!-- Titik Animasi 1 (Flow Icon <-> Kotak) -->
                                <circle cx="0" cy="0" r="3.5" fill="var(--color-grid)">
                                    <animateMotion id="grid_flow_anim_1" repeatCount="indefinite" keyTimes="1;0" calcMode="linear" dur="2s">
                                        <mpath href="#grid-line-1"></path>
                                    </animateMotion>
                                </circle>
                                <!-- Titik Animasi 2 (Flow Kotak <-> Inverter) -->
                                <circle cx="0" cy="0" r="3.5" fill="var(--color-grid)">
                                    <animateMotion id="grid_flow_anim_2" repeatCount="indefinite" keyTimes="1;0" calcMode="linear" dur="2s">
                                        <mpath href="#grid-line-2"></path>
                                    </animateMotion>
                                </circle>
                            </svg>
                            
                            <!-- Daily Grid Buy Value -->
                            <text id="daily_grid_buy_value" x="40" y="265" display="" class="st10 left-align" fill="var(--color-grid)">
                                --
                            </text>
                            <text id="daily_grid_buy" x="15" y="280" display="" class="st3 left-align" fill="var(--color-grid)">
                                DAILY GRID BUY
                            </text>
                            <text id="grid_name" x="40" y="295" display="" class="st3 st8 left-align" fill="var(--color-grid)">
                                Grid
                            </text>
                        </svg>
                    
                        <!-- Load Elements -->
                        <svg id="Load" style="overflow: visible" x="0%">
                            <!-- KOTAK BARU UNTUK DISPLAY POWER LOAD -->
                            <svg id="load_power_box" x="304" y="203.5">
                                <rect width="70" height="30" rx="4.5" ry="4.5" fill="none" stroke-width="2" pointer-events="all" stroke="var(--color-load)"></rect>
                                
                                <!-- Nilai Daya Load -->
                                <a href="#">
                                    <!-- INI MENAMPILKAN ACTIVE POWER METER ABSOLUT -->
                                    <text id="ess_power" x="35" y="15" dominant-baseline="central" text-anchor="middle" class="st4 st8" fill="var(--color-load)">
                                        -- W
                                    </text>
                                </a>
                            </svg>

                            <!-- Load Flow line from Inverter -->
                            <svg id="load-flow">
                                <!-- Path 1: Dari Inverter ke Kotak -->
                                <path fill="none" stroke-miterlimit="10" pointer-events="stroke" id="es-line-1" d="M 265 218.5 L 304 218.5" display="" stroke="var(--color-load)" stroke-width="2"></path>
                                <!-- Path 2: Dari Kotak ke Load Icon -->
                                <path fill="none" stroke-miterlimit="10" pointer-events="stroke" id="es-line-2" d="M 374 218.5 L 398 218.5" display="" stroke="var(--color-load)" stroke-width="2"></path>
                                
                                <!-- Titik Animasi 1 (Flow Inverter -> Kotak) -->
                                <circle cx="0" cy="0" id="es-dot-1" r="3.5" fill="var(--color-load)">
                                    <animateMotion id="load_flow_anim_1" repeatCount="indefinite" keyTimes="0;1" calcMode="linear" dur="2s">
                                        <mpath href="#es-line-1"></path>
                                    </animateMotion>
                                </circle>
                                <!-- Titik Animasi 2 (Flow Kotak -> Icon) -->
                                <circle cx="0" cy="0" id="es-dot-2" r="3.5" fill="var(--color-load)">
                                    <animateMotion id="load_flow_anim_2" repeatCount="indefinite" keyTimes="0;1" calcMode="linear" dur="2s">
                                        <mpath href="#es-line-2"></path>
                                    </animateMotion>
                                </circle>
                            </svg>
                            
                            <!-- Load Icon (House/Home) -->
                            <a href="#">
                                <svg id="essen" viewBox="0 0 24 24" x="395" y="176" width="79" height="79">
                                    <path fill="var(--color-load)" d="m15 13l-4 4v-3H2v-2h9V9l4 4M5 20v-4h2v2h10v-7.81l-5-4.5L7.21 10H4.22L12 3l10 9h-3v8H5Z"></path>
                                </svg>
                            </a>
                            
                            <!-- Daily Load Value -->
                            <a href="#">
                                <text id="daily_load_value" x="411" y="265" display="" class="st10 left-align" fill="var(--color-load)">
                                    -- kWh
                                </text>
                            </a>
                            <text id="daily_load" x="413" y="280" display="" class="st3 left-align" fill="var(--color-load)">
                                DAILY LOAD
                            </text>
                        </svg>
                    
                        <!-- Battery Elements -->
                        <svg id="battery_main" style="overflow: visible; display: inline;" x="0%">
                            <g>
                                <!-- KOTAK BARU UNTUK DISPLAY POWER BATERAI -->
                                <svg id="battery_power_box" x="204" y="280">
                                    <rect width="70" height="30" rx="4.5" ry="4.5" fill="none" stroke-width="2" pointer-events="all" stroke="var(--color-battery)"></rect>
                                    
                                    <!-- Nilai Daya Baterai -->
                                    <a href="#">
                                        <text id="data.batteryPower_190" x="35" y="15" dominant-baseline="central" text-anchor="middle" class="st4 st8" fill="var(--color-battery)">
                                            -- W
                                        </text>
                                    </a>
                                </svg>

                                <!-- Battery Flow Lines and Animation - Menggunakan X=239 sebagai sumbu tengah -->
                                <svg id="battery_flow" style="overflow: visible;">
                                    <!-- Path 1 (bat-line): Dari Inverter ke Atas Kotak -->
                                    <path fill="none" stroke-miterlimit="10" pointer-events="stroke" id="bat-line" d="M 239 250 L 239 280" display="" stroke="var(--color-battery)" stroke-width="2"></path>
                                    
                                    <!-- Path 2: Dari Kotak ke Atas Baterai Icon -->
                                    <path fill="none" stroke-miterlimit="10" pointer-events="stroke" id="bat-line-to-icon" d="M 239 310 L 239 325" display="" stroke="var(--color-battery)" stroke-width="2"></path>

                                    <!-- Titik Animasi 1 (Flow Inverter <-> Kotak) - Dihilangkan keyPoints awal untuk fix bug posisi -->
                                    <circle cx="0" cy="0" id="power-dot-discharge" r="3.5" fill="var(--color-battery)">
                                         <animateMotion id="bat_flow_anim_1" repeatCount="indefinite" keyTimes="0;1" calcMode="linear" dur="2s">
                                            <mpath href="#bat-line"></path>
                                        </animateMotion>
                                    </circle>
                                    
                                    <!-- Titik Animasi 2 (Flow Kotak <-> Ikon) - Dihilangkan keyPoints awal untuk fix bug posisi -->

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const csvData = e.target.result;
                parseCSVData(csvData);
            };
            reader.readAsText(file);
        }

        function parseCSVData(csvData) {
            const lines = csvData.trim().split('\n');
            const labels = [];
            const dataSets = {};
            lines.forEach((line, index) => {
                const columns = line.split(',');
                if (index === 0) {
                    columns.slice(1).forEach(col => dataSets[col] = []);
                } else {
                    if (columns.length > 1) { 
                        labels.push(columns[0].substring(0,5));
                        columns.slice(1).forEach((value, i) => {
                            const colName = Object.keys(dataSets)[i];
                            dataSets[colName].push(parseFloat(value));
                        });
                    }
                }
            });
            
            const finalLabels = labels.filter(l => l.length > 0);

            datasets = Object.keys(dataSets).map((name, i) => ({
                label: name,
                data: dataSets[name],
                borderColor: `hsl(${(i * 130) % 360}, 100%, 50%)`,
                borderWidth: 1.5, 
                fill: false,
                hidden: !(i < 3), 
                pointRadius: 0,
                tension: 0.4
            }));
            createChart(finalLabels, datasets);
            createCheckboxes();
        }

        function createChart(labels, datasets) {
            const ctx = document.getElementById('lineChart').getContext('2d');
            if (chart) chart.destroy();
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            ticks: { color: '#E0E0E0' }
                        },
                        y: {
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            ticks: { color: '#E0E0E0' }
                        }
                    },
                    elements: {
                        line: { tension: 0.4 },
                        point: { radius: 0 }
                    }
                }
            });
        }

        // ==========================================================
        // 3. DIAGRAM SVG LOGIC (Fungsionalitas Baru)

        const DEFAULT_DISPLAY = 0.0;
        const DEFAULT_DISPLAY_STR = '--';

        // Helper untuk parsing angka yang aman
        function tryParseFloat(value) {
            const parsed = parseFloat(value);
            // Kembali ke DEFAULT_DISPLAY (0.0) jika NaN, null, atau undefined
            if (isNaN(parsed) || value === null || value === undefined) {
                return DEFAULT_DISPLAY;
            }
            return parsed;
        }

        // Data yang dipetakan dari MQTT untuk Diagram
        let latestDiagramData = {
            solarPower: DEFAULT_DISPLAY, // Dari MPPT.power (W)
            loadPower: DEFAULT_DISPLAY, // Dari PowerMeter.activePower (absolut, W)
            batteryPower: DEFAULT_DISPLAY, // Dari BMS.power (Positif = Discharge, Negatif = Charge, W)
            gridPower: DEFAULT_DISPLAY, // CALCULATED: Load - Solar - Battery (Positif = Buy/Import, Negatif = Sell/Export, W)
            
            dailySolar: DEFAULT_DISPLAY_STR,
            dailyLoad: DEFAULT_DISPLAY_STR,
            dailyGridBuy: DEFAULT_DISPLAY_STR,
            dailyBatCharge: DEFAULT_DISPLAY_STR,
            dailyBatDischarge: DEFAULT_DISPLAY_STR,
            batterySOC: 0,
            batteryRemainingEnergy: DEFAULT_DISPLAY_STR,
            inverterVoltage: DEFAULT_DISPLAY_STR + ' V',
            inverterCurrent: DEFAULT_DISPLAY_STR + ' A',
            loadFrequency: DEFAULT_DISPLAY_STR + ' Hz',
            pvVoltage: DEFAULT_DISPLAY_STR + ' V',
            pvCurrent: DEFAULT_DISPLAY_STR + ' A',
            runtime: DEFAULT_DISPLAY_STR
        };

        function getFlowDuration(power) {
            const minDuration = 0.5;
            const maxDuration = 10;
            const maxPower = 5000;
            let duration = maxDuration - (power / maxPower) * (maxDuration - minDuration);
            
            if (power < 10) duration = maxDuration;
            if (power > maxPower) duration = minDuration; 
            
            return `${duration.toFixed(1)}s`;
        }

        function controlFlow(animIds, powerValue, absPower, forwardKeyPoints, reverseKeyPoints) {
            const flowSpeed = getFlowDuration(absPower);
            const isFlowing = absPower > 10; // Threshold 10W untuk start flow
            
            animIds.forEach(id => {
                const animElement = document.getElementById(id);
                if (!animElement) return;

                if (!isFlowing) {
                    animElement.parentNode.style.opacity = 0; // Sembunyikan dot
                    animElement.setAttribute('dur', '10.0s');
                    animElement.setAttribute('repeatCount', '1'); // Stop animation (1 repeat)
                } else {
                    animElement.parentNode.style.opacity = 1; // Tampilkan dot
                    animElement.setAttribute('repeatCount', 'indefinite');
                    animElement.setAttribute('keyTimes', '0;1'); 
                    animElement.setAttribute('dur', flowSpeed);
                }
                
                // Atur arah
                if (powerValue > 0) { // Arah "Positif" (default path direction)
                    animElement.setAttribute('keyPoints', forwardKeyPoints);
                } else { // Arah "Negatif" (kebalikan dari default path direction)
                    animElement.setAttribute('keyPoints', reverseKeyPoints);
                }
            });
        }
        
        // FUNGSI INTI UNTUK MENGHITUNG DAN MEMPERBARUI SEMUA DATA DIAGRAM
        function calculateAndRenderDiagram() {
            // Ambil nilai data, pastikan selalu berupa float (atau 0.0 jika belum ada data)
            const loadPower = latestDiagramData.loadPower; 
            const solarPower = latestDiagramData.solarPower;
            const batteryPower = latestDiagramData.batteryPower; 
            
            // Net Grid Power = Load - PV - BAT
            // Positif > 0 : Buy/Import (ditarik dari Grid)
            // Negatif < 0 : Sell/Export (dikembalikan ke Grid)
            const netGridPowerCalc = loadPower - solarPower - batteryPower;
            
            // Simpan hasil perhitungan (Buy/Sell value)
            latestDiagramData.gridPower = parseFloat(netGridPowerCalc.toFixed(1)); 

            // 2. Render
            updateTextValues(latestDiagramData);
            updateBatteryLevel(latestDiagramData.batterySOC);
            
            // 3. Kontrol Animasi Aliran
            
            // 1. Solar Flow (Solar -> Inverter): Selalu maju (0;1) jika ada daya
            controlFlow(['solar_flow_anim_1', 'solar_flow_anim_2'], latestDiagramData.solarPower, Math.abs(latestDiagramData.solarPower), "0;1", "1;0");

            // 2. Load Flow (Inverter -> Load): Selalu maju (0;1) jika ada beban
            controlFlow(['load_flow_anim_1', 'load_flow_anim_2'], latestDiagramData.loadPower, Math.abs(latestDiagramData.loadPower), "0;1", "1;0");

            // 3. Battery Flow (Tergantung tanda BMS power)
            const batAbsPower = Math.abs(latestDiagramData.batteryPower);
            
            if (latestDiagramData.batteryPower > 10) { // Discharge (BAT -> INV, UPWARDS). Positif=Discharge
                // Path direction 0;1 is Down (Charge). To go UP (Discharge), we use reverse: "1;0"
                controlFlow(['bat_flow_anim_1', 'bat_flow_anim_2'], 1, batAbsPower, "1;0", "0;1"); 
            } else if (latestDiagramData.batteryPower < -10) { // Charge (INV -> BAT, DOWNWARDS). Negatif=Charge
                 // To go DOWN (Charge), we use forward: "0;1"
                 controlFlow(['bat_flow_anim_1', 'bat_flow_anim_2'], -1, batAbsPower, "0;1", "1;0");
            } else {
                controlFlow(['bat_flow_anim_1', 'bat_flow_anim_2'], 0, 0, "0;1", "1;0"); 
            }

            // 4. Grid Flow (HANYA AKTIF JIKA BUY/IMPORT)
            const gridFlowValue = latestDiagramData.gridPower; // Positif = Buy
            const gridAbsPower = Math.abs(gridFlowValue);
            
            if (gridFlowValue > 10) { // Buy/Import (Grid -> Inverter: 1;0)
                // Grid flow path 0;1 is LEFT-to-RIGHT (Sell). To go RIGHT-to-LEFT (Buy), we use reverse: "1;0"
                controlFlow(['grid_flow_anim_1', 'grid_flow_anim_2'], -1, gridAbsPower, "1;0", "0;1");
                document.getElementById('grid_power_box').querySelector('rect').setAttribute('stroke', 'var(--color-grid)'); // Biru (Input)
            } else { 
                // Jika Sell/Export (< -10) ATAU No Flow (approx 0), set flow ke nol
                controlFlow(['grid_flow_anim_1', 'grid_flow_anim_2'], 0, 0, "1;0", "0;1"); 
                document.getElementById('grid_power_box').querySelector('rect').setAttribute('stroke', 'var(--color-grid)');
            }
        }


        function updateTextValues(data) {
            const setText = (id, content) => {
                const el = document.getElementById(id);
                if (el) {
                    el.textContent = content;
                } else {

            // Power dan Nilai Utama (1 angka di belakang koma)
            // Gunakan 0.0 W jika nilai Power <= 0.1 W (agar terlihat 0.0 W saat tidak ada aliran)
            const solarP = data.solarPower > 0.1 ? data.solarPower.toFixed(1) : DEFAULT_DISPLAY.toFixed(1);
            const loadP = data.loadPower > 0.1 ? data.loadPower.toFixed(1) : DEFAULT_DISPLAY.toFixed(1);
            const batP = Math.abs(data.batteryPower) > 0.1 ? Math.abs(data.batteryPower).toFixed(1) : DEFAULT_DISPLAY.toFixed(1);
            
            // Grid Power Display: Hanya tampilkan nilai jika > 10 W (BUY/IMPORT)
            const gridPDisplay = data.gridPower > 10 ? data.gridPower.toFixed(1) : DEFAULT_DISPLAY.toFixed(1); 
            
            setText('pv1_power_186', `${solarP} W`); 
            setText('grid_total_power', `${gridPDisplay} W`); 
            setText('ess_power', `${loadP} W`); 
            setText('data.batteryPower_190', `${batP} W`); 
            
            // Nilai PV Detail & Inverter
            setText('pv2_power_label', `${data.pvVoltage} / ${data.pvCurrent}`); 
            setText('inverter_voltage_154', data.inverterVoltage); 
            setText('inverter_current_164', data.inverterCurrent); 
            setText('load_frequency_192', data.loadFrequency); 

            // Nilai Energi Harian & SOC (dibiarkan seperti sebelumnya)
            setText('total_solar_value', `${data.dailySolar} kWh / ${DEFAULT_DISPLAY_STR} MWh`); 
            setText('daily_load_value', `${data.dailyLoad} kWh`); 
            setText('daily_grid_buy_value', `${data.dailyGridBuy} kWh`);
            setText('daily_bat_charge_value', `${data.dailyBatCharge} kWh`);
            setText('daily_bat_dischcharge_value', `${data.dailyBatDischarge} kWh`);
            setText('battery_soc_184', `${data.batterySOC}% | ${DEFAULT_DISPLAY_STR}%`); 
            setText('battery_remaining_energy', data.batteryRemainingEnergy); 
            setText('duration', data.runtime); 
        }

        function updateBatteryLevel(soc) {
            const batteryInner = document.getElementById('bat_inner');
            const batteryIcon = document.getElementById('battery_icon');
            if (!batteryInner || !batteryIcon) return;
            
            if (latestDiagramData.batteryPower < -10) {
                batteryIcon.classList.add('is-charging');
            } else {
                batteryIcon.classList.remove('is-charging');
            }

            batteryInner.querySelectorAll('rect').forEach(rect => rect.remove());

            const totalBars = 8;
            const socPerBar = 100 / totalBars;
            const barWidth = 7;
            const barHeight = 1.5;
            const startX = 5;
            let currentY = 20;
            // pastikan SOC adalah angka yang valid
            soc = parseInt(soc);
            if (isNaN(soc)) soc = 0;

            if (soc === 0) {
                const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                rect.setAttribute('x', startX);
                rect.setAttribute('y', currentY);
                rect.setAttribute('width', barWidth);
                rect.setAttribute('height', barHeight);
                rect.setAttribute('rx', 0.5);
                rect.setAttribute('ry', 0.5);
                rect.setAttribute('fill', 'var(--color-bar-red)');
                batteryInner.appendChild(rect);
                return; 
            }

            for (let i = 0; i < totalBars; i++) {
                const barSocThreshold = (i + 1) * socPerBar;
                
                let barColor;
                if (soc >= barSocThreshold) {
                    barColor = 'var(--color-bar-green)';
                } else if (soc > (barSocThreshold - socPerBar) && soc < barSocThreshold) {
                    barColor = 'var(--color-battery-low)';
                } else {
                    barColor = 'var(--color-bar-red)';
                }

                if (soc < 25 && i > 5) { barColor = 'var(--color-bar-red)'; } 
                else if (soc < 50 && i === 6) { barColor = 'var(--color-battery-low)'; }


                const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                rect.setAttribute('x', startX);
                rect.setAttribute('y', currentY);
                rect.setAttribute('width', barWidth);
                rect.setAttribute('height', barHeight);
                rect.setAttribute('rx', 0.5);
                rect.setAttribute('ry', 0.5);
                rect.setAttribute('fill', barColor);
                
                batteryInner.appendChild(rect);
                currentY -= (barHeight + 0.5);
            }
        }
        
        // ==========================================================
        // 4. MQTT LOGIC & DATA MAPPING
        // ==========================================================
        
        let is_request_log = false;
        let csv_like_data = "";
        
        // Pengaturan Koneksi MQTT (WSS)
        const host = 'public.cloud.shiftr.io';
        const port = 443; 
        
        let client = mqtt.connect(`wss://${host}`, {
            username: "public",
            password: "public"
        });
        
        
        function removeStatusItems() {
            const container = document.getElementById('data-container');
            container.querySelectorAll('[id^="mppt-status-"]').forEach(el => el.remove());
            const oldStatusItem = document.getElementById('3469224/amsanmppt/status');
            if (oldStatusItem) oldStatusItem.remove();
        }

        // FUNGSI BARU UNTUK MENGAMBIL DATA POWER METER DARI fatkhur/pwrMeter
        function updatePowerMeterData(payload) {
            try {
                const data = JSON.parse(payload);
                
                // --- MAPPING DATA INVERTER / AC METER ---
                const v = tryParseFloat(data.volt).toFixed(1);
                const i = tryParseFloat(data.current).toFixed(1);
                const f = tryParseFloat(data.freq).toFixed(1);

                latestDiagramData.inverterVoltage = `${v} V`;
                latestDiagramData.inverterCurrent = `${i} A`;
                latestDiagramData.loadFrequency = `${f} Hz`;

                // MAPPING LOAD POWER (KOTAK RUMAH): Active Power Absolut dari Meter
                const activePower = tryParseFloat(data.activePower);
                
                // Load Power adalah Active Power yang diukur (Absolut), dibulatkan ke 1 desimal
                latestDiagramData.loadPower = parseFloat(Math.abs(activePower).toFixed(1)); 
                
                calculateAndRenderDiagram();

            } catch (e) {
                console.error("Failed to parse Power Meter JSON:", e, payload);
            }
        }
        
        // FUNGSI UNTUK MENGAMBIL DATA MPPT (Topics yang sama di kedua file)
        function updateData(topic, payload) {
            const container = document.getElementById('data-container');
            let dataKey = topic.substring(topic.lastIndexOf('/') + 1); 
            const keyLower = dataKey.toLowerCase();
            let pValue = tryParseFloat(payload);
            let shouldRecalculate = false;

            // --- PERUBAHAN STATUS ---
            if (keyLower === 'status') {
                const statuses = payload.split(';').filter(s => s.trim() !== '');
                
                removeStatusItems(); 

                statuses.forEach((status, index) => {
                    const parts = status.split('-');
                    const statusKey = parts[0] || 'STATUS';
                    const statusValue = parts.slice(1).join('-') || status;

                    const id = `mppt-status-${index}`;
                    
                    let dataItem = document.createElement('div');
                    dataItem.className = 'data-item status-item'; 
                    dataItem.id = id;
                    
                    dataItem.innerHTML = `<strong>${statusKey}</strong><div class="payload">${statusValue}</div>`;
                    container.appendChild(dataItem);
                });
                return; 
            }

            // Jika bukan status, proses seperti biasa
            let dataItem = document.getElementById(topic);
            
            if (!dataItem) {
                dataItem = document.createElement('div');
                dataItem.className = 'data-item';
                dataItem.id = topic;
                container.appendChild(dataItem);
            }

            let displayPayload = payload;
            
            if (pValue !== DEFAULT_DISPLAY) {
                let pValueFixed1 = pValue.toFixed(1);
                
                // --- MAPPING SOLAR POWER (KOTAK PV) ---
                if (keyLower === 'power') { 
                    latestDiagramData.solarPower = parseFloat(pValueFixed1); 
                    shouldRecalculate = true;
                }

                // --- MAPPING VOLTAGE, CURRENT, & ENERGY ---
                if (keyLower.includes('current')) {
                    latestDiagramData.pvCurrent = `${pValueFixed1} A`;
                } else if (keyLower.includes('vpv')) {
                    latestDiagramData.pvVoltage = `${pValueFixed1} V`;
                } else if (keyLower.includes('daye')) {
                    latestDiagramData.dailySolar = pValueFixed1;
                }
                
                // Gunakan payload asli jika bukan power/voltage/current atau payload sangat besar/kecil
                if (payload.length > 5 || pValue === 0) {
                     displayPayload = pValue.toFixed(2);
                } else {
                    displayPayload = payload;
                }
            }
            
            dataItem.innerHTML = `<strong>${dataKey}</strong><div class="payload">${displayPayload}</div>`;

            if (shouldRecalculate) {
                 calculateAndRenderDiagram();
            }
        }


        function updateDataBat(topic, payload) {
            let EndTopic = topic.split("/").pop(); 
            let shouldUpdateSummary = false;
            const EndTopicLower = EndTopic.toLowerCase();
            let pValue = tryParseFloat(payload); // Gunakan tryParseFloat untuk stabilitas
            let shouldRecalculate = false;

            if (isNaN(pValue)) return;

            // === Mengambil data ke variabel global ===
            if(EndTopicLower === "packvolt"){
                vpack = pValue;
                shouldUpdateSummary = true;
            }
            else if(EndTopicLower === "relativesoc"){
                RSOC = pValue;
                latestDiagramData.batterySOC = pValue; 
                shouldUpdateSummary = true;
            }
            else if(EndTopicLower === "remainingcapacity"){
                remcapacity = pValue;
                latestDiagramData.batteryRemainingEnergy = `${(pValue/1000).toFixed(1)} Ah`; 
                shouldUpdateSummary = true;
            }
            else if(EndTopicLower === "current"){
                current = pValue;
                shouldUpdateSummary = true;
            }
            else if(EndTopicLower === "power"){
                // MAPPING BATTERY POWER (KOTAK BATRE): Positif=Discharge, Negatif=Charge
                power = pValue;
                latestDiagramData.batteryPower = parseFloat(pValue.toFixed(1)); 
                shouldUpdateSummary = true;
                shouldRecalculate = true;
            }
            else if(EndTopicLower === "nominalcapacity"){
                nomcapacity = pValue;
                shouldUpdateSummary = true;
            }
            else if(EndTopicLower === "cyclelife"){
                cycles = pValue;
                shouldUpdateSummary = true;
            }
            else if(EndTopicLower === "balancestatus"){
                cellbalance = pValue;
                let x = 0;
                while ((x <cells.length)) {
                    cells[x].setBalancing(cellbalance & (0b1 << x));
                    x++;
                }
            }
            else if(EndTopicLower.startsWith('vcell')){
                const cellIndex = parseInt(EndTopic.substring(5));
                if (cellIndex >= 0 && cellIndex < cells.length) {
                    cells[cellIndex].setVoltage(pValue, vpack, RSOC);
                }
            }
            else if(EndTopicLower === 'vcelldiff'){
               Vdiff = pValue;
               shouldUpdateSummary = true;
            }
            
            // === Membangun Summary Text ===
            if(shouldUpdateSummary) {
                const v = vpack !== undefined ? (vpack/1000).toFixed(1) : DEFAULT_DISPLAY_STR;
                const i = current !== undefined ? (current/1000).toFixed(1) : DEFAULT_DISPLAY_STR;
                const p = power !== undefined ? parseFloat(power).toFixed(1) : DEFAULT_DISPLAY_STR; 
                const remC = remcapacity !== undefined ? (remcapacity/1000).toFixed(1) : DEFAULT_DISPLAY_STR;
                const nomC = nomcapacity !== undefined ? (nomcapacity/1000).toFixed(1) : DEFAULT_DISPLAY_STR;
                const soc = RSOC !== undefined ? RSOC : DEFAULT_DISPLAY_STR;
                const cyc = cycles !== undefined ? cycles : DEFAULT_DISPLAY_STR;
                const vD = Vdiff !== undefined ? Vdiff : DEFAULT_DISPLAY_STR;

                $('.summary').html(` 
                  <span> Voltage: <b>${v}</b>V, Current: <b>${i}</b>A, Power: <b>${p}</b>W</span>
                  <span> Capacity: <b>${remC}</b> / <b>${nomC}</b> Ah ( <b>${soc}%</b> )</span>
                  <span> Cycles: <b>${cyc}</b>x, Cell Diff: <b>${vD}</b>mV</span>
                `);
            }
            
            if (shouldRecalculate) {
                calculateAndRenderDiagram();
            }
        }

        // FUNGSI LAMA (INIT) - MENGGABUNGKAN KONEKSI MQTT UNTUK SEMUA DATA
        function initMqttClient() {
            client.on("connect", () => {
                console.log('%cConnected to broker', 'color: cyan; font-weight: bold;');
                
                // Langganan Topik:
                client.subscribe('3469224/#'); 
                client.subscribe('JBDMBS/#');
                client.subscribe('fatkhur/pwrMeter');
                
                calculateAndRenderDiagram(); 
            });

            client.on("error", (error) => {
                console.error('Connection failed: ', error);
                $('.summary').html(`<span style="color:red; font-weight:bold;">KONEKSI GAGAL! Periksa Konsol Browser. Error: ${error.message}</span>`);
            });
            
            client.on("message", (topic, payloadBuffer) => {
                const topicString = topic.toString();
                const payload = payloadBuffer.toString();
                
                if (topicString === "fatkhur/pwrMeter") {
                    updatePowerMeterData(payload);
                }
                else if (topicString === "3469224/amsanmppt/log") {
                    if(is_request_log == true){
                        if (payload.indexOf("Time") >= 0) {
                            csv_like_data = payload + '\n'
                        } else if (payload.indexOf("endOfFile") >= 0) {
                            unshowAn();
                            parseCSVData(csv_like_data);
                            is_request_log=false;
                        } else if (payload.indexOf("Fail") >= 0) {
                            unshowAn();
                            console.error("Data Not available, or broken storage!"); 
                        } else {
                            csv_like_data += payload + '\n'
                        }
                    }
                } 
                else if (topicString.includes("JBDMBS") || topicString.includes("jbdmbs")) {
                    updateDataBat(topicString, payload);
                } 
                else if (topicString.includes("amsanmppt") || topicString.includes("AMSANMPPT") || topicString.includes("3469224")) {
                    updateData(topicString, payload);
                }
            });
        }


        // ==========================================================
        // 5. EVENT HANDLERS & INITIALIZATION
        // ==========================================================

        $(document).ready(function() {
            const cellContainer = $('cells');
            let x = 8;
            while (x-- > 0) {
                const cell = new Cell(80, 70, 5);
                cells.push(cell);
                cell.getDrawing().addTo(cellContainer.get(0));
            }

            // Inisialisasi awal diagram
            calculateAndRenderDiagram();

            // INISIALISASI MQTT CLIENT SETELAH DOM LENGKAP
            initMqttClient();
        });

        document.getElementById('requestButton').addEventListener('click', function() {
            const selectedDate = datePicker.input.value;
            const url = `1#${selectedDate}`;
            if (client) {
                client.publish('3469224/amsanmppt/cmd', url); 
                is_request_log = true;
                showAn();
            }
        });

        function unshowAn() {
            document.getElementById("loader").style.display = "none";
        }
        function showAn() {
            document.getElementById("loader").style.display = "block";
        }

    </script>
